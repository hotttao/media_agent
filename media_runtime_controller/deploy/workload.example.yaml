# Stable name = agent- + first 24 hex characters of SHA256(environmentId + NUL + workspaceId).
# Fill name/claimName/identitySecret using the same IDs; normally Gateway emits this object.
apiVersion: runtime.media-agent.io/v1alpha1
kind: AgentWorkload
metadata:
  name: agent-144e05bfc0bac32d56e863eb
  namespace: media-agent-runtime
  labels:
    runtime.media-agent.io/workspace-id: workspace-1
    runtime.media-agent.io/config-id: configuration-1
    runtime.media-agent.io/environment-id: local-kubernetes
    runtime.media-agent.io/agent-type: codex
  annotations:
    runtime.media-agent.io/control-version: '1'
spec:
  sessionExchange: media.agent.sessions.v1
  metadataExchange: media.agent.metadata.v1
  driver: kubernetes
  namespace: media-agent-runtime
  workspaceId: workspace-1
  agentConfigId: configuration-1
  environmentId: local-kubernetes
  agentType: codex
  image: media-agent-codex:latest
  replicas: 2
  port: 3001
  cpu: '1'
  memory: 2Gi
  claimName: agent-144e05bfc0bac32d56e863eb-workspace
  storageClass: REPLACE_RWX_STORAGE_CLASS
  storageSize: 10Gi
  gatewayUrl: http://media-agent-gateway:8006
  identitySecret: agent-144e05bfc0bac32d56e863eb-identity
  sharedSecret: media-agent-runtime
