# Based on https://github.com/penpot/penpot/blob/develop/docker/images/docker-compose.yaml
# Keep all Penpot app images on the same version.
name: penpot
x-flags: &flags
  PENPOT_FLAGS: enable-login-with-password enable-registration disable-email-verification disable-secure-session-cookies enable-smtp enable-mcp enable-admin-console
x-uri: &uri
  PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://mini-001.local:9001}
x-secret: &secret
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set in private .env}
x-database: &database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set in private .env}
services:
  penpot-frontend:
    image: penpotapp/frontend:${PENPOT_VERSION:-2.18}
    restart: unless-stopped
    ports: ["${PENPOT_BIND:-127.0.0.1}:9001:8080"]
    volumes: ["${DATA_ROOT:-/data}/penpot/assets:/opt/data/assets"]
    environment:
      <<: [*flags, *uri]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
    depends_on: [penpot-backend, penpot-admin-console, penpot-mcp, penpot-exporter]
  penpot-backend:
    image: penpotapp/backend:${PENPOT_VERSION:-2.18}
    restart: unless-stopped
    volumes: ["${DATA_ROOT:-/data}/penpot/assets:/opt/data/assets"]
    depends_on:
      penpot-postgres: {condition: service_healthy}
      penpot-valkey: {condition: service_healthy}
    environment:
      <<: [*flags, *uri, *secret, *database]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_SMTP_DEFAULT_FROM: no-reply@media-agent.local
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@media-agent.local
      PENPOT_SMTP_HOST: penpot-mailpit
      PENPOT_SMTP_PORT: 1025
      PENPOT_SMTP_TLS: "false"
      PENPOT_SMTP_SSL: "false"
  penpot-admin-console:
    image: penpotapp/admin-console:${PENPOT_VERSION:-2.18}
    restart: unless-stopped
    depends_on:
      penpot-postgres: {condition: service_healthy}
    environment:
      <<: [*uri, *secret, *database]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
  penpot-mcp:
    image: penpotapp/mcp:${PENPOT_VERSION:-2.18}
    restart: unless-stopped
  penpot-exporter:
    image: penpotapp/exporter:${PENPOT_VERSION:-2.18}
    restart: unless-stopped
    depends_on:
      penpot-valkey: {condition: service_healthy}
    environment:
      <<: [*flags, *uri, *secret]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
  penpot-postgres:
    image: postgres:15
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in private .env}
    volumes: ["${DATA_ROOT:-/data}/penpot/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U penpot]
      interval: 2s
      timeout: 10s
      retries: 10
  penpot-valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    command: valkey-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lfu
    volumes: ["${DATA_ROOT:-/data}/penpot/valkey:/data"]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 10
  penpot-mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: ["${DATA_ROOT:-/data}/penpot/mailpit:/data"]
    ports: ["127.0.0.1:8025:8025"]
