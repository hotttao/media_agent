# grafana datasources — 启动时自动配 Prometheus / Loki / Jaeger 三数据源
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        # 日志里的 trace_id 字段链接到 Jaeger
        - datasourceUid: jaeger
          matcherRegex: "trace_id\":\"([0-9a-f]+)"
          name: TraceID
          url: "$${__value.raw}"

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
