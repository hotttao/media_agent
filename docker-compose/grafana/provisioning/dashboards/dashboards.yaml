# grafana dashboards provider — 启动时自动加载 /var/lib/grafana/dashboards/*.json
apiVersion: 1

providers:
  - name: media-agent
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
