# prometheus.yml — 抓取目标配置
#
# 抓取：
#   - host 上的 app :9091/metrics（media_example / media-cli serve 的 monitor-prometheus 端口）
#   - otel-collector :8888（collector 自身指标）

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hertz-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
