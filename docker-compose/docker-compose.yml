# 基础设施（默认只包含业务数据库，不启动认证、网关或可观测性服务）。
#
# 编码/单元测试：不需要启动 Compose。
# 本地联调：docker compose -f docker-compose.yml up -d postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: media_auth
      POSTGRES_PASSWORD: media_auth
      POSTGRES_DB: media_auth
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_ROOT:-/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [media-net]

networks:
  media-net:
    name: media-net
