- id: media-mcp-user-token
  upstream:
    url: http://host.docker.internal:8002
  match:
    url: http://mini-001.local:18080/mcp
    methods: [GET, POST, DELETE]
  authenticators:
    - handler: oauth2_introspection
      config:
        introspection_url: http://media_auth:8001/internal/token/api-token:verify
        scope_strategy: exact
        required_scope: [mcp.access]
        prefix: talos_
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
      config:
        ttl: 1m
        claims: |
          {
            "aud": ["media-agent-gateway-mcp"],
            "principal_type": "user",
            "act": {"sub": "{{ print .Extra.actor_id }}"},
            "organization_id": "{{ print .Extra.organization_id }}",
            "credential_id": "{{ print .Extra.credential_id }}",
            "scope": "{{ print .Extra.scope }}",
            "auth_source": "{{ print .Extra.auth_source }}"
          }

- id: media-worker-api-token
  upstream:
    url: http://host.docker.internal:8002
  match:
    url: http://mini-001.local:18080/api/worker/v1/<.*>
    methods: [GET, POST, PUT, PATCH, DELETE]
  authenticators:
    - handler: oauth2_introspection
      config:
        introspection_url: http://media_auth:8001/internal/token/api-token:verify
        scope_strategy: exact
        prefix: talos_
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
      config:
        ttl: 2m
        claims: |
          {
            "aud": ["media-workflow"],
            "principal_type": "user",
            "act": {"sub": "{{ print .Extra.actor_id }}"},
            "organization_id": "{{ print .Extra.organization_id }}",
            "credential_id": "{{ print .Extra.credential_id }}",
            "scope": "{{ print .Extra.scope }}",
            "auth_source": "{{ print .Extra.auth_source }}"
          }

- id: media-agent-authenticated-api
  upstream:
    url: http://host.docker.internal:8002
  match:
    url: http://mini-001.local:18080/api/<(auth/me|chat.*|mcp-oauth.*|oauth.*|users.*|teams.*|organizations.*|api-tokens.*|worker-identities.*|service-tokens.*|v1.*)>
    methods: [GET, POST, PUT, PATCH, DELETE]
  authenticators:
    - handler: cookie_session
    - handler: oauth2_introspection
      config:
        introspection_url: http://media_auth:8001/internal/token/api-token:verify
        scope_strategy: exact
        required_scope: [api.access]
        prefix: talos_
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
      config:
        ttl: 5m
        claims: |
          {
            "aud": ["internal-api"],
            "principal_type": "user",
            "organization_id": "{{ print .Extra.organization_id }}",
            "credential_id": "{{ print .Extra.credential_id }}",
            "scope": "{{ print .Extra.scope }}",
            "auth_source": "{{ print .Extra.auth_source }}"
          }

# Application administration is an interactive Kratos session path.
# Auth resolves the Kratos identity and enforces current platform-admin status.
- id: media-application-administration
  upstream:
    url: http://media_auth:8001
  match:
    url: http://mini-001.local:18080/api/applications<(/[a-z][a-z0-9_-]{0,63}/(status|secret))?>
    methods: [GET, POST, PATCH]
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
      config:
        ttl: 1m
        claims: |
          {"aud": ["internal-api"], "principal_type": "user"}

# Dedicated application protocol: routing only, NOT an authenticated User.
# media_auth verifies Basic and mac_ credentials itself and never falls back to Cookie.
# Do not extend these rules to /api, /internal, Agent or MCP routes.
- id: media-application-users
  upstream:
    url: http://media_auth:8001
  match:
    url: http://mini-001.local:18080/apps/v1/users/<[^/]+>
    methods: [GET, PUT]
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: media-application-token
  upstream:
    url: http://media_auth:8001
  match:
    url: http://mini-001.local:18080/apps/v1/users/<[^/]+>/token
    methods: [POST]
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: media-application-userinfo
