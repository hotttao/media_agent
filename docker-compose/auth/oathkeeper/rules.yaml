- id: media-worker-api-token
  upstream:
    url: http://host.docker.internal:8002
  match:
    url: http://192.168.124.66:18080/api/worker/v1/<.*>
    methods: [GET, POST, PUT, PATCH, DELETE]
  authenticators:
    - handler: oauth2_introspection
      config:
        introspection_url: http://media_auth:8001/internal/token/api-token:verify
        scope_strategy: exact
        prefix: talos_
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
      config:
        ttl: 2m
        claims: |
          {
            "aud": ["media-workflow"],
            "principal_type": "user",
            "act": {"sub": "{{ print .Extra.actor_id }}"},
            "organization_id": "{{ print .Extra.organization_id }}",
            "credential_id": "{{ print .Extra.credential_id }}",
            "scope": "{{ print .Extra.scope }}",
            "auth_source": "{{ print .Extra.auth_source }}"
          }

- id: media-agent-authenticated-api
  upstream:
    url: http://host.docker.internal:8002
  match:
    url: http://192.168.124.66:18080/api/<(auth/me|chat.*|mcp-oauth.*|oauth.*|users.*|teams.*|organizations.*|api-tokens.*|worker-identities.*|service-tokens.*|v1.*)>
    methods: [GET, POST, PUT, PATCH, DELETE]
  authenticators:
    - handler: cookie_session
    - handler: oauth2_introspection
      config:
        introspection_url: http://media_auth:8001/internal/token/api-token:verify
        scope_strategy: exact
        required_scope: [api.access]
        prefix: talos_
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
      config:
        ttl: 5m
        claims: |
          {
            "aud": ["internal-api"],
            "principal_type": "user",
            "organization_id": "{{ print .Extra.organization_id }}",
            "credential_id": "{{ print .Extra.credential_id }}",
            "scope": "{{ print .Extra.scope }}",
            "auth_source": "{{ print .Extra.auth_source }}"
          }
