serve:
  api:
    host: 0.0.0.0
    port: 4456
  proxy:
    host: 0.0.0.0
    port: 4455

access_rules:
  matching_strategy: regexp
  repositories:
    - file:///etc/oathkeeper/rules.yaml

authenticators:
  cookie_session:
    enabled: true
    config:
      check_session_url: http://kratos:4433/sessions/whoami
      preserve_path: true
      subject_from: identity.id
      only:
        - ory_kratos_session
  noop:
    enabled: true
  oauth2_introspection:
    enabled: true
    config:
      introspection_url: http://host.docker.internal:8001/internal/token/verify
      scope_strategy: exact
      prefix: tos_
      cache:
        enabled: false

authorizers:
  allow:
    enabled: true

mutators:
  id_token:
    enabled: true
    config:
      issuer_url: http://oathkeeper:4456/
      jwks_url: file:///etc/oathkeeper/id_token.jwks.json
      ttl: 5m
      claims: |
        {
          "aud": ["internal-api"],
          "principal_type": "user"
        }

errors:
  fallback: [json]
  handlers:
    json:
      enabled: true

log:
  level: info
  format: json
