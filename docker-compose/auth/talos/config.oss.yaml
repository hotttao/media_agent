# Ory Talos OSS single-node configuration for local and test environments.
# The SQLite database lives under ${DATA_ROOT:-/data}/talos on the host.
serve:
  http:
    host: "0.0.0.0"
    port: 4420
    request_log:
      exclude_health_endpoints: true
    cors:
      enabled: false
  metrics:
    host: "0.0.0.0"
    port: 4422

credentials:
  issuer: "http://talos:4420"
  api_keys:
    default_ttl: "720h"
    max_ttl: "8760h"
    prefix:
      current: "talos"
      retired: []
  derived_tokens:
    default_ttl: "5m"
    jwt:
      signing_keys:
        urls:
          # Published development-only key from the upstream OSS compose.
          - "base64:"
    macaroon:
      prefix:
        current: "mc"
        retired: []

db:
  dsn: "sqlite3:///var/lib/talos/talos.db?_journal_mode=WAL"

secrets:
  hmac:
    current: "local-talos-hmac-secret-minimum-32-chars-long"
    retired: []

cache:
  type: "noop"
  ttl: "5m"

multitenancy:
  enabled: false

# Observability is opt-in for integration debugging. Keep normal coding tests
# self-contained and do not require an OTLP collector.
tracing:
  enabled: false

log:
  level: "info"
  format: "json"
