http:
  routers:
    ory-hydra:
      rule: "PathPrefix(`/ory/hydra`)"
      priority: 130
      middlewares: [strip-ory-hydra]
      service: ory-hydra
    ory-kratos:
      rule: "PathPrefix(`/self-service`) || PathPrefix(`/sessions`) || PathPrefix(`/schemas`) || PathPrefix(`/health/ready`) || PathPrefix(`/health/alive`)"
      priority: 125
      service: ory-kratos
    ory-consent:
      rule: "PathPrefix(`/consent`)"
      priority: 122
      service: ory-consent
    ory-login-ui:
      rule: "Path(`/settings`) || PathPrefix(`/settings/`) || Path(`/recovery`) || PathPrefix(`/recovery/`) || Path(`/verification`) || PathPrefix(`/verification/`) || Path(`/logout`) || PathPrefix(`/logout/`) || Path(`/error`) || PathPrefix(`/error/`)"
      priority: 120
      service: ory-login-ui
    authenticated-user:
      rule: "Path(`/api/auth/me`)"
      priority: 110
      middlewares: [oathkeeper-forward-auth]
      service: auth
    oathkeeper-jwks:
      rule: "Path(`/.well-known/jwks.json`)"
      priority: 140
      service: oathkeeper-api
    oauth:
      rule: "PathPrefix(`/api/oauth`) || PathPrefix(`/api/users`) || PathPrefix(`/api/teams`) || PathPrefix(`/api/organizations`) || PathPrefix(`/api/service-tokens`)"
      priority: 100
      middlewares: [oathkeeper-forward-auth]
      service: auth
    workflow-worker:
      rule: "PathPrefix(`/api/worker/v1`)"
      priority: 115
      middlewares: [oathkeeper-worker-forward-auth]
      service: workflow
    materials:
      rule: "PathPrefix(`/api/v1/materials`) || PathPrefix(`/api/v1/products`) || PathPrefix(`/api/v1/asset-kinds`) || PathPrefix(`/api/v1/generated-assets`) || PathPrefix(`/api/v1/virtual-ips`) || PathPrefix(`/api/v1/library-objects`)"
      priority: 50
      middlewares: [oathkeeper-forward-auth]
      service: materials
    workflow:
      rule: "PathPrefix(`/api/v1/workflows`) || PathPrefix(`/api/v1/templates`) || PathPrefix(`/api/v1/jobs`) || PathPrefix(`/api/v1/step-runs`)"
      priority: 50
      middlewares: [oathkeeper-forward-auth]
      service: workflow
    control:
      rule: "PathPrefix(`/api/v1/workspaces`)"
      priority: 60
      middlewares: [oathkeeper-forward-auth]
      service: control
    frontend:
      rule: "PathPrefix(`/`)"
      priority: 1
      service: frontend

  middlewares:
    oathkeeper-forward-auth:
      forwardAuth:
        address: "http://oathkeeper:4456/decisions"
        trustForwardHeader: false
        authResponseHeaders: [Authorization]
    oathkeeper-worker-forward-auth:
      forwardAuth:
        address: "http://oathkeeper:4456/decisions"
        trustForwardHeader: false
        authResponseHeaders: [Authorization]
    strip-ory-hydra:
      stripPrefix:
        prefixes:
          - /ory/hydra

  services:
    ory-kratos:
      loadBalancer:
        servers:
          - url: "http://kratos:4433"
    ory-hydra:
      loadBalancer:
        servers:
          - url: "http://hydra:4444"
    ory-login-ui:
      loadBalancer:
        servers:
          - url: "http://login-ui:3000"
    ory-consent:
      loadBalancer:
        servers:
          - url: "http://consent:3001"
    oathkeeper-api:
      loadBalancer:
        servers:
          - url: "http://oathkeeper:4456"
    auth:
      loadBalancer:
        servers:
          - url: "http://media_auth:8001"
    materials:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8003"
    workflow:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8002"
    control:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8007"
    frontend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
