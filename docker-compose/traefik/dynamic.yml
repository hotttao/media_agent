http:
  routers:
    ory-hydra:
      rule: "PathPrefix(`/ory/hydra`)"
      priority: 130
      middlewares: [strip-ory-hydra]
      service: ory-hydra
    ory-kratos:
      rule: "PathPrefix(`/self-service`) || PathPrefix(`/sessions`) || PathPrefix(`/schemas`) || PathPrefix(`/health/ready`) || PathPrefix(`/health/alive`)"
      priority: 125
      service: ory-kratos
    ory-consent:
      rule: "PathPrefix(`/consent`)"
      priority: 122
      service: ory-consent
    ory-login-ui:
      rule: "Path(`/settings`) || PathPrefix(`/settings/`) || Path(`/recovery`) || PathPrefix(`/recovery/`) || Path(`/verification`) || PathPrefix(`/verification/`) || Path(`/logout`) || PathPrefix(`/logout/`) || Path(`/error`) || PathPrefix(`/error/`)"
      priority: 120
      service: ory-login-ui
    ory-login-assets:
      # Explicit Ory assets only: /assets/<hashed frontend bundles> belong to
      # the production frontend and must not be swallowed by this router.
      rule: "Path(`/assets/normalize.css`) || Path(`/assets/inter-font.css`) || Path(`/assets/jetbrains-mono-font.css`) || Path(`/assets/fa-brands.min.css`) || Path(`/assets/fa-solid.min.css`) || Path(`/assets/fontawesome.min.css`) || Path(`/assets/passwordInput.js`) || Path(`/auth-layout.css`) || Path(`/content-layout.css`) || Path(`/main.css`) || Path(`/style.css`) || Path(`/theme.css`) || Path(`/ory-logo.svg`) || Path(`/ory-small.svg`) || Path(`/favico.png`) || Path(`/.well-known/ory/webauthn.js`) || PathPrefix(`/assets/inter/`) || PathPrefix(`/assets/jetbrains-mono/`) || PathPrefix(`/assets/webfonts/`)"
      priority: 120
      service: ory-login-ui
    authenticated-user:
      rule: "Path(`/api/auth/me`)"
      priority: 110
      middlewares: [oathkeeper-forward-auth]
      service: auth
    oathkeeper-jwks:
      rule: "Path(`/.well-known/jwks.json`)"
      priority: 140
      service: oathkeeper-api
    oauth:
      rule: "PathPrefix(`/api/mcp-oauth`) || PathPrefix(`/api/oauth`) || PathPrefix(`/api/users`) || PathPrefix(`/api/teams`) || PathPrefix(`/api/organizations`) || PathPrefix(`/api/api-tokens`) || PathPrefix(`/api/worker-identities`) || PathPrefix(`/api/service-tokens`)"
      priority: 100
      middlewares: [oathkeeper-forward-auth]
      service: auth
    workflow-worker:
      rule: "PathPrefix(`/api/worker/v1`)"
      priority: 115
      middlewares: [oathkeeper-worker-forward-auth]
      service: workflow
    materials:
      rule: "PathPrefix(`/api/v1/materials`) || PathPrefix(`/api/v1/products`) || PathPrefix(`/api/v1/asset-kinds`) || PathPrefix(`/api/v1/generated-assets`) || PathPrefix(`/api/v1/virtual-ips`) || PathPrefix(`/api/v1/library-objects`)"
      priority: 50
      middlewares: [oathkeeper-forward-auth]
      service: materials
    workflow:
      rule: "PathPrefix(`/api/v1/workflows`) || PathPrefix(`/api/v1/templates`) || PathPrefix(`/api/v1/jobs`) || PathPrefix(`/api/v1/step-runs`) || PathPrefix(`/api/v1/historical-video-pushes`) || PathPrefix(`/api/v1/capabilities`)"
      priority: 50
      middlewares: [oathkeeper-forward-auth]
      service: workflow
    control:
      rule: "PathPrefix(`/api/v1/workspaces`) || PathPrefix(`/api/v1/model-connections`) || PathPrefix(`/api/v1/prompts`) || PathPrefix(`/api/v1/skills`)"
      priority: 60
      middlewares: [oathkeeper-forward-auth]
      service: control
    plugin-bindings:
      rule: "PathRegexp(`^/api/v1/workspaces/[^/]+/mcp-bindings(/.*)?$`)"
      priority: 80
      middlewares: [oathkeeper-forward-auth]
      service: plugin
    agent-chat-and-catalog:
      rule: "PathPrefix(`/api/chat`) || PathPrefix(`/api/v1/mcp-definitions`) || PathRegexp(`^/api/v1/sessions/[^/]+/resume$`)"
      priority: 70
      middlewares: [oathkeeper-forward-auth]
      service: agent-api
    media-mcp:
      rule: "Path(`/mcp`)"
      priority: 115
      middlewares: [mcp-public-headers, oathkeeper-forward-auth]
      service: agent-api
    agent-proxy:
      # Agent Gateway introspects the API Token and issues its own assertion.
      # No Ory User/Worker mutation applies to this entry point.
      rule: "Path(`/api/agent/v1/requests`)"
      priority: 60
      service: agent-api
    agent-client-management:
      rule: "PathPrefix(`/api/v1/agent-clients`)"
      priority: 60
      middlewares: [oathkeeper-forward-auth]
      service: agent-api
    agent-frontend:
      rule: "PathPrefix(`/agent`)"
      priority: 20
      service: agent-frontend
    frontend:
      rule: "PathPrefix(`/`)"
      priority: 1
      service: frontend

  middlewares:
    mcp-public-headers:
      headers:
        customRequestHeaders:
          X-Session-Token: ""
          X-Agent-Instance-Credential: ""
          X-Agent-Replica-ID: ""
          X-Agent-Incarnation-ID: ""
          X-Agent-Turn-ID: ""
          X-Agent-Execution-Epoch: ""
          X-Media-MCP-Service-Token: ""
          X-Media-MCP-Workflow-Delegation: ""
          X-Media-MCP-Materials-Delegation: ""
    oathkeeper-forward-auth:
      forwardAuth:
        address: "http://oathkeeper:4456/decisions"
        trustForwardHeader: false
        authResponseHeaders: [Authorization]
    oathkeeper-worker-forward-auth:
      forwardAuth:
        address: "http://oathkeeper:4456/decisions"
        trustForwardHeader: false
        authResponseHeaders: [Authorization]
    strip-ory-hydra:
      stripPrefix:
        prefixes:
          - /ory/hydra

  services:
    ory-kratos:
      loadBalancer:
        servers:
          - url: "http://kratos:4433"
    ory-hydra:
      loadBalancer:
        servers:
          - url: "http://hydra:4444"
    ory-login-ui:
      loadBalancer:
        servers:
          - url: "http://login-ui:3000"
    ory-consent:
      loadBalancer:
        servers:
          - url: "http://consent:3001"
    oathkeeper-api:
      loadBalancer:
        servers:
          - url: "http://oathkeeper:4456"
    auth:
      loadBalancer:
        servers:
          - url: "http://media_auth:8001"
    materials:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8003"
    workflow:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8002"
    control:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8007"
    agent-frontend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5178"
    frontend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
    plugin:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8011"
    agent-api:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8006"
