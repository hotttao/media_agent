# 统一业务网关（显式启动）。
# 配置集中在 traefik/；Compose 不使用业务容器 labels。
# 默认监听 mini-001.local:18080（8080 已被 Conductor 占用）。

services:
  media_gateway:
    image: traefik:v3.1
    container_name: media-agent-gateway
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      # Bind all host interfaces so the LAN address (mini-001.local) and local
      # loopback both traverse Docker's published-port rules consistently.
      - "0.0.0.0:18080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - auth
    restart: unless-stopped

networks:
  auth:
    external: true
    name: media-auth
