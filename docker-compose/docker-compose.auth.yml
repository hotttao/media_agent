name: media-agent-auth

# Current-repository-owned Ory stack. Nothing in this file depends on the
# sibling ory-compose repository. Start it explicitly before the gateway.
services:
  auth-postgres:
    image: m.daocloud.io/docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORY_POSTGRES_PASSWORD:-ory-local-postgres}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ory-postgres:/var/lib/postgresql/data
      - ./auth/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [auth]
    restart: unless-stopped

  kratos-migrate:
    image: ghcr.io/hotttao/ory-kratos:v26.2.0
    command: migrate sql -e -y -c /etc/config/kratos/kratos.yml
    depends_on:
      auth-postgres:
        condition: service_healthy
    volumes:
      - ./auth/kratos:/etc/config/kratos:ro
    networks: [auth]
    restart: "no"

  kratos:
    image: ghcr.io/hotttao/ory-kratos:v26.2.0
    command: serve -c /etc/config/kratos/kratos.yml --dev
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    volumes:
      - ./auth/kratos:/etc/config/kratos:ro
    ports:
      # Host-run media_auth needs the Admin API to revoke sessions during local
      # integration tests; keep it loopback-only and out of the LAN gateway.
      - "127.0.0.1:4434:4434"
    networks: [auth]
    restart: unless-stopped

  kratos-courier:
    image: ghcr.io/hotttao/ory-kratos:v26.2.0
    command: courier watch -c /etc/config/kratos/kratos.yml
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    volumes:
      - ./auth/kratos:/etc/config/kratos:ro
    networks: [auth]
    restart: unless-stopped

  kratos-seed:
    image: ghcr.io/hotttao/ory-kratos:v26.2.0
    entrypoint: ["/bin/sh"]
    command: ["/etc/config/kratos/seed-identities.sh"]
    depends_on:
      kratos:
        condition: service_started
    environment:
      KRATOS_ADMIN_URL: http://kratos:4434
      DEV_USER_EMAIL: ${ORY_DEV_USER_EMAIL:-admin@media-agent.local}
      DEV_USER_PASSWORD: ${ORY_DEV_USER_PASSWORD:-Media-agent-2026}
    volumes:
      - ./auth/kratos:/etc/config/kratos:ro
    networks: [auth]
    restart: "no"

  hydra-migrate:
    image: ghcr.io/hotttao/ory-hydra:v26.2.0
    command: migrate sql -e --yes postgres://hydra:hydra-local@auth-postgres:5432/hydra?sslmode=disable
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks: [auth]
    restart: "no"

  hydra:
    image: ghcr.io/hotttao/ory-hydra:v26.2.0
    command: serve all --dev
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://hydra:hydra-local@auth-postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/ory/hydra/
      URLS_SELF_PUBLIC: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/ory/hydra/
      URLS_LOGIN: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/login
      URLS_CONSENT: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/consent
      URLS_LOGOUT: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/logout
      URLS_ERROR: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/error
      URLS_POST_LOGOUT_REDIRECT: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/
      URLS_IDENTITY_PROVIDER_PUBLICURL: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/
      URLS_IDENTITY_PROVIDER_URL: http://kratos:4434/
      SECRETS_SYSTEM: ${ORY_HYDRA_SYSTEM_SECRET:-local-hydra-system-secret-change-me-32}
      SECRETS_COOKIE: ${ORY_HYDRA_COOKIE_SECRET:-local-hydra-cookie-secret-change-me-32}
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public,pairwise
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: ${ORY_HYDRA_PAIRWISE_SALT:-local-hydra-pairwise-salt-change-me}
      STRATEGIES_ACCESS_TOKEN: jwt
      LOG_LEVEL: ${ORY_LOG_LEVEL:-info}
    networks: [auth]
    restart: unless-stopped

  keto-migrate:
    image: ghcr.io/hotttao/ory-keto:v26.2.0
    command: migrate up -y -c /etc/config/keto/keto.yml
    depends_on:
      auth-postgres:
        condition: service_healthy
    volumes:
      - ./auth/keto:/etc/config/keto:ro
    networks: [auth]
    restart: "no"

  keto:
    image: ghcr.io/hotttao/ory-keto:v26.2.0
    command: serve -c /etc/config/keto/keto.yml
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    volumes:
      - ./auth/keto:/etc/config/keto:ro
    ports:
      # Loopback-only endpoints let host-run services project/check relations
      # without exposing Keto's read or administrative API to the LAN gateway.
      - "127.0.0.1:4466:4466"
      - "127.0.0.1:4467:4467"
    networks: [auth]
    restart: unless-stopped

  oathkeeper:
    image: ghcr.io/hotttao/ory-oathkeeper:v26.2.0
    command: serve -c /etc/oathkeeper/config.yaml
    depends_on:
      kratos:
        condition: service_started
    environment:
      AUTHENTICATORS_OAUTH2_INTROSPECTION_CONFIG_INTROSPECTION_REQUEST_HEADERS: '{"X-Media-Auth-Internal-Token":"${MEDIA_AUTH_INTERNAL_TOKEN:-dev-media-auth-internal-token}"}'
    volumes:
      - ./auth/oathkeeper:/etc/oathkeeper:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [auth]
    restart: unless-stopped

  # Talos OSS is intentionally built from a pinned upstream source revision:
  # the community edition does not publish a supported public image. It runs
  # single-node with SQLite and stays inside the authentication network.
  talos-init:
    build:
      context: https://github.com/ory/talos.git#${TALOS_GIT_REF:-2e2295d}
      dockerfile: deployments/docker/Dockerfile.oss.init
    environment:
      DB_DSN: sqlite3:///var/lib/talos/talos.db?_journal_mode=WAL
    volumes:
      - ${DATA_ROOT:-/data}/talos:/var/lib/talos
    networks: [auth]
    restart: "no"

  talos:
    build:
      context: https://github.com/ory/talos.git#${TALOS_GIT_REF:-2e2295d}
      dockerfile: .docker/Dockerfile-local-build
    command: ["serve", "--config", "/etc/talos/config.yaml"]
    depends_on:
      talos-init:
        condition: service_completed_successfully
    volumes:
      - ./auth/talos/config.oss.yaml:/etc/talos/config.yaml:ro
      - ${DATA_ROOT:-/data}/talos:/var/lib/talos
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4422/health/alive"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [auth]
    restart: unless-stopped

  login-ui:
    image: ghcr.io/korjavin/kratos-selfservice-ui-node-vendor:latest
    depends_on: [kratos, hydra]
    environment:
      PORT: "3000"
      SECURITY_MODE: ""
      # The UI app appends /self-service/... itself; a trailing slash produces
      # //self-service and Kratos redirects before cookies are forwarded.
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_BROWSER_URL: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_ADMIN_URL: http://hydra:4445
      BASE_URL: ${ORY_PUBLIC_URL:-http://192.168.2.41:18080}/
      COOKIE_SECRET: ${ORY_UI_COOKIE_SECRET:-local-login-ui-cookie-secret-change-me}
      CSRF_COOKIE_SECRET: ${ORY_UI_CSRF_SECRET:-local-login-ui-csrf-secret-change-me}
      CSRF_COOKIE_NAME: ory_ui_csrf
      DANGEROUSLY_DISABLE_SECURE_CSRF_COOKIES: "true"
    networks: [auth]
    restart: unless-stopped

  consent:
    image: ghcr.io/korjavin/ory-consent:latest
    depends_on: [kratos, hydra]
    environment:
      PORT: "3001"
      HYDRA_ADMIN_URL: http://hydra:4445
      KRATOS_ADMIN_URL: http://kratos:4434
    networks: [auth]
    restart: unless-stopped

  mailpit:
    image: m.daocloud.io/docker.io/axllent/mailpit:v1.27.8
    networks: [auth]
    restart: unless-stopped

networks:
  auth:
    name: media-auth

volumes:
  ory-postgres:
    name: media-agent-ory-postgres
