services:
  media_storage:
    build:
      context: ..
      dockerfile: media_storage/Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - ../docker-compose/.env.${INFRA:-e2e}
    environment:
      SERVER_ADDR: ":8008"
      POSTGRES_DSN: postgres://media_auth:media_auth@host.docker.internal:5432/media-storage?sslmode=disable
      MEDIA_STORAGE_LOCAL_ROOT: /data/media-storage
      LOG_DIR: /media_logs/media-storage
    volumes:
      - ../media_logs/media-storage:/media_logs/media-storage
      - ./data:/data/media-storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
