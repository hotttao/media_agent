services:
  media_control:
    build:
      context: ..
      dockerfile: media_control/Dockerfile
    ports:
      - "8007:8007"
    env_file:
      - ../docker-compose/.env.${INFRA:-e2e}
    environment:
      SERVER_ADDR: ":8007"
      CONSUL_ENABLED: "false"
      CONSUL_KV_ENABLED: "false"
      POSTGRES_DSN: postgres://media_auth:media_auth@host.docker.internal:5432/media-control?sslmode=disable
      CONTROL_INTERNAL_TOKEN: ${CONTROL_INTERNAL_TOKEN:-dev-control-internal-token}
      MEDIA_AUTH_URL: http://media_auth:8001
      MEDIA_AUTH_INTERNAL_TOKEN: ${MEDIA_AUTH_INTERNAL_TOKEN:-dev-media-auth-internal-token}
      ORY_KRATOS_PUBLIC_URL: http://kratos:4433
      INTERNAL_JWKS_URL: http://oathkeeper:4456/.well-known/jwks.json
      INTERNAL_JWT_ISSUER: http://oathkeeper:4456/
      MEDIA_AGENT_GATEWAY_URL: http://host.docker.internal:8006
      AGENT_METADATA_ENABLED: ${AGENT_METADATA_ENABLED:-false}
      AGENT_METADATA_GATEWAY_CREDENTIAL: ${AGENT_METADATA_GATEWAY_CREDENTIAL:-}
      AGENT_METADATA_ARTIFACT_ROOT: /data/metadata
      AGENT_METADATA_EXCHANGE: ${AGENT_METADATA_EXCHANGE:-media.agent.metadata.v1}
      MEDIA_AGENTS_RABBITMQ_URL: amqp://${RABBITMQ_USER:-media_agent}:${RABBITMQ_PASSWORD:-media_agent}@host.docker.internal:5672/
      MEDIA_PLUGIN_URL: ${MEDIA_PLUGIN_URL:-http://host.docker.internal:8011}
      MCP_CONTROL_CREDENTIAL: ${MCP_CONTROL_CREDENTIAL:-}
      AGENT_WORKLOAD_ENABLED: ${AGENT_WORKLOAD_ENABLED:-false}
      AGENT_WORKLOAD_DRIVER: ${AGENT_WORKLOAD_DRIVER:-docker}
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL:-http://media_agent_gateway:8006}
      AGENT_CODEX_IMAGE: ${AGENT_CODEX_IMAGE:-media-agent-codex:local}
      AGENT_CLAUDE_IMAGE: ${AGENT_CLAUDE_IMAGE:-media-agent-claude-code:local}
      AGENT_GOOSE_IMAGE: ${AGENT_GOOSE_IMAGE:-media-agent-goose:local}
      LOG_DIR: /media_logs/media-control
    volumes:
      - ../media_logs/media-control:/media_logs/media-control
      - ./conf:/app/conf:ro
      - metadata_artifacts:/data/metadata
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - auth
    restart: unless-stopped

networks:
  auth:
    external: true
    name: media-auth

volumes:
  metadata_artifacts:
