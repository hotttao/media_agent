app:
  name: media-agent-gateway
  version: v1
  env: ${APP_ENV:-local}

server:
  max_request_body_bytes: ${MAX_REQUEST_BODY_BYTES:-12582912}
  enabled: true
  address: ${SERVER_ADDR:-:8006}

database:
  enabled: true
  driver: postgres
  dsn: ${POSTGRES_DSN:-postgres://media_auth:media_auth@127.0.0.1:5432/media-agent-gateway?sslmode=disable}
  max_open_conns: 50
  max_idle_conns: 10
  migrate_on_start: true

consul:
  enabled: ${CONSUL_ENABLED:-false}

consul_kv:
  enabled: ${CONSUL_KV_ENABLED:-false}

otel:
  enabled: ${OTEL_ENABLED:-false}

prometheus:
  enabled: ${PROMETHEUS_ENABLED:-false}

access_log:
  enabled: true
  format: "[${time}] ${status} - ${latency} ${method} ${path}"
  time_format: "2006-01-02T15:04:05Z"

log:
  enabled: true
  level: ${LOG_LEVEL:-debug}
  dir: ${LOG_DIR:-}
  filename: app.log
  max_size_mb: 100
  max_backups: 10
  max_age_days: 7
  compress: true
  console: true

recovery:
  enabled: true
  print_stack: true

request_id:
  enabled: true
  header: "X-Request-ID"

cors:
  enabled: true
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["*"]
  allow_credentials: false
  max_age_seconds: 600

pprof:
  enabled: true
  prefix: "/debug/pprof"

health:
  enabled: false
  path: "/health"

auth:
  jwt_secret: ${JWT_SECRET:-dev-shared-secret}

rabbitmq:
  enabled: ${MEDIA_AGENTS_RABBITMQ_ENABLED:-true}
  url: ${MEDIA_AGENTS_RABBITMQ_URL:-amqp://media_agent:media_agent@127.0.0.1:5672/}
  session_exchange: ${MEDIA_AGENTS_SESSION_EXCHANGE:-media.agent.sessions.v1}
  receiver_buffer: 256

agent_metadata:
  enabled: ${AGENT_METADATA_ENABLED:-false}
  artifact_root: ${AGENT_METADATA_ARTIFACT_ROOT:-./data/metadata}
  metadata_exchange: ${AGENT_METADATA_EXCHANGE:-media.agent.metadata.v1}
  gateway_credential: ${AGENT_METADATA_GATEWAY_CREDENTIAL:-}

agent_runtime:
  enabled: ${AGENT_RUNTIME_ENABLED:-false}
  credential_keys_file: ${AGENT_RUNTIME_CREDENTIAL_KEYS_FILE:-}
  signing_key_file: ${AGENT_RUNTIME_SIGNING_KEY_FILE:-}
  environment_id: ${AGENT_ENVIRONMENT_ID:-}
  kubernetes_config_file: ${AGENT_RUNTIME_KUBERNETES_CONFIG_FILE:-}
  kubernetes_namespace: ${AGENT_RUNTIME_KUBERNETES_NAMESPACE:-default}
  docker_identity_url: ${AGENT_RUNTIME_DOCKER_IDENTITY_URL:-}
  docker_internal_credential: ${AGENT_RUNTIME_DOCKER_INTERNAL_CREDENTIAL:-}

agent_mcp:
  enabled: ${AGENT_MCP_ENABLED:-false}
  allowed_upstream_hosts: ${AGENT_MCP_ALLOWED_UPSTREAM_HOSTS:-[]}
  plugin_url: ${MEDIA_PLUGIN_URL:-}
  plugin_credential: ${MCP_PLUGIN_GATEWAY_CREDENTIAL:-}

agent_workload:
  enabled: ${AGENT_WORKLOAD_ENABLED:-false}

# Public User MCP is enabled independently of the managed Agent entry headers.
media_mcp:
  enabled: ${MEDIA_MCP_ENABLED:-false}
  definition_id: media-workflow
  allowed_origins: ${MEDIA_MCP_ALLOWED_ORIGINS:-[]}
mcp_delegation:
  enabled: ${MEDIA_MCP_ENABLED:-false}
  issuer: ${MCP_DELEGATION_ISSUER:-}
  signing_key_file: ${MCP_DELEGATION_SIGNING_KEY_FILE:-}
  edge_jwks_url: ${INTERNAL_JWKS_URL:-}
  edge_issuer: ${INTERNAL_JWT_ISSUER:-}
