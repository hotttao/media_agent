[project]
name = "goose"
version = "0.1.0"
description = "Goose agent: uses adapter + goose acp child process"
requires-python = ">=3.11"
dependencies = [
    "adapter",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "omegaconf",
    "pydantic>=2",
    "pydantic-settings",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["goose"]
package-dir = {"goose" = "."}
