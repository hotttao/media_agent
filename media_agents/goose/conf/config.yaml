agent:
  type: goose
  port: ${oc.env:PORT,3002}

capabilities:
  system_prompt: true
  mcp: true
  skills: true
  questions: false
  reconnect: true
  permissions: true
  streaming_deltas: true

goose:
  program: ${oc.env:GOOSE_BIN,goose}
  args: []
  path_root: ${oc.env:GOOSE_PATH_ROOT,null}
  config_dir: ${oc.env:GOOSE_CONFIG_DIR,/root/.config/goose}
