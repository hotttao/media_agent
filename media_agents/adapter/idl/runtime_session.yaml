openapi: 3.0.3
info:
  title: Media Agents Runtime Session API
  version: 1.0.0
paths:
  /api/v1/runtime-sessions:
    post:
      operationId: registerRuntimeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRuntimeSessionRequest'
      responses:
        '201':
          description: Registered or existing compatible Runtime Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSessionResponse'
        '409':
          description: Existing Runtime Session uses a different context version
  /api/v1/runtime-sessions/{session_id}:
    get:
      operationId: getRuntimeSession
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Runtime Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSessionResponse'
  /api/v1/runtime-sessions/{session_id}/turns:
    post:
      operationId: submitTurn
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitTurnRequest'}
      responses:
        '202':
          description: Turn accepted and persisted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TurnResponse'}
        '404': {description: Not found}
  /api/v1/runtime-sessions/{session_id}/events:
    get:
      operationId: replayRuntimeSessionEvents
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: query, name: after_sequence, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
      responses:
        '200':
          description: Durable events ordered by Session sequence
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/UniversalEventResponse'}}
        '404': {description: Runtime Session not found}
  /api/v1/runtime-sessions/{session_id}/messages:
    get:
      operationId: listRuntimeSessionMessages
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
      responses:
        '200':
          description: Stable Message history ordered by Message sequence
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MessageResponse'}}
        '404': {description: Runtime Session not found}
  /api/v1/runtime-sessions/{session_id}/turns/{turn_id}:
    get:
      operationId: getTurn
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: turn_id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Persisted Turn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TurnResponse'}
        '404': {description: Not found}
  /api/v1/runtime-sessions/{session_id}/turns/{turn_id}/interrupt:
    post:
      operationId: interruptTurn
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: turn_id, required: true, schema: {type: string}}
      responses:
        '202': {description: Soft interrupt accepted}
  /api/v1/runtime-sessions/{session_id}/requests:
    get:
      operationId: listAgentRequests
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: query, name: turn_id, schema: {type: string}}
      responses:
        '200':
          description: Agent Requests ordered by creation time
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AgentRequestResponse'}}
  /api/v1/runtime-sessions/{session_id}/turns/{turn_id}/requests/{request_id}/resolve:
    post:
      operationId: resolveAgentRequest
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: turn_id, required: true, schema: {type: string}}
        - {in: path, name: request_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveAgentRequestRequest'}
      responses:
        '200':
          description: Idempotently resolved Agent Request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRequestResponse'}
        '409': {description: Conflicting response or terminal Turn}
components:
  schemas:
    ResolveAgentRequestRequest:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response: {type: object}
    AgentRequestResponse:
      type: object
      required: [request_id, session_id, turn_id, request_type, payload, status, created_at]
      properties:
        request_id: {type: string}
        session_id: {type: string}
        turn_id: {type: string}
        request_type: {type: string, enum: [confirm, input, permission]}
        payload: {type: object}
        status: {type: string, enum: [pending, resolved, cancelled, expired]}
        response: {type: object, nullable: true}
        resolved_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    SubmitTurnRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key, context_version, input]
      properties:
        idempotency_key: {type: string, maxLength: 128}
        context_version: {type: integer, minimum: 1}
        input: {type: object}
        api_key: {type: string, maxLength: 4096, writeOnly: true}
        session_token: {type: string, maxLength: 4096, writeOnly: true}
    TurnResponse:
      type: object
      required: [turn_id, session_id, idempotency_key, enqueue_sequence, status, context_version, input, created_at]
      properties:
        turn_id: {type: string}
        session_id: {type: string}
        idempotency_key: {type: string}
        enqueue_sequence: {type: integer}
        status: {type: string, enum: [queued, running, completed, failed, interrupted, cancelled]}
        context_version: {type: integer}
        input: {type: object}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        error_class: {type: string, nullable: true}
    RegisterRuntimeSessionRequest:
      type: object
      additionalProperties: false
      required: [session_id, context_version, context_ref]
      properties:
        session_id: {type: string, minLength: 1, maxLength: 64}
        context_version: {type: integer, format: int64, minimum: 1}
        context_ref: {type: string, minLength: 1, maxLength: 512}
    RuntimeSessionResponse:
      type: object
      required: [session_id, context_version, context_ref, status, chat_status, next_turn_sequence, next_event_sequence, next_message_sequence, created_at, updated_at]
      properties:
        session_id: {type: string}
        context_version: {type: integer, format: int64}
        context_ref: {type: string}
        status: {type: string, enum: [active, paused, failed, deleted]}
        chat_status: {type: string, enum: [human, agent]}
        active_turn_id: {type: string, nullable: true}
        runtime_session_id: {type: string, nullable: true}
        next_turn_sequence: {type: integer, format: int64}
        next_event_sequence: {type: integer, format: int64}
        next_message_sequence: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UniversalEventResponse:
      type: object
      required: [event_id, session_id, sequence, event_type, payload, created_at]
      properties:
        event_id: {type: string}
        session_id: {type: string}
        turn_id: {type: string, nullable: true}
        sequence: {type: integer, format: int64}
        event_type: {type: string}
        payload: {type: object}
        created_at: {type: string, format: date-time}
    MessageResponse:
      type: object
      required: [message_id, session_id, turn_id, role, content_ref, sequence, created_at]
      properties:
        message_id: {type: string}
        session_id: {type: string}
        turn_id: {type: string}
        role: {type: string}
        content_ref: {type: object}
        sequence: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
