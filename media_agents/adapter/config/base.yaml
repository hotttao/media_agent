agent:
  type: generic
  port: ${oc.env:PORT,3000}

capabilities:
  system_prompt: true
  mcp: true
  skills: false
  questions: false
  reconnect: true
  permissions: true
  streaming_deltas: true

workspace:
  id: ${oc.env:RUNTIME_WORKSPACE_ID,local}
  dir: ${oc.env:WORKSPACE_DIR,/workspace}
  keep_files:
    - AGENTS.md
    - runtime.json

cp:
  url: ${oc.env:CP_URL,null}
  workspace_id: ${oc.env:WORKSPACE_ID,null}

bridge_ttl:
  idle_ttl_ms: 600000
  max_count: 10
  evict_interval_ms: 60000

keepalive:
  interval_ms: 15000

database:
  url: ${oc.env:MEDIA_AGENTS_DB_URL,postgresql+asyncpg://media_auth:media_auth@127.0.0.1:5432/media_auth}
  migrate_on_start: ${oc.decode:${oc.env:MEDIA_AGENTS_DB_MIGRATE_ON_START,true}}
  echo: ${oc.decode:${oc.env:MEDIA_AGENTS_DB_ECHO,false}}

event_bus:
  rabbitmq_url: ${oc.env:MEDIA_AGENTS_RABBITMQ_URL,null}
  session_exchange: ${oc.env:MEDIA_AGENTS_SESSION_EXCHANGE,media.agent.sessions.v1}
  tool_result_max_bytes: ${oc.decode:${oc.env:MEDIA_AGENTS_TOOL_RESULT_MAX_BYTES,32768}}
  tool_result_window_ms: ${oc.decode:${oc.env:MEDIA_AGENTS_TOOL_RESULT_WINDOW_MS,300}}

runtime:
  file: runtime.json
  prompt_file: AGENTS.md

skills:
  enabled: false
  dir: .agents/skills

environment:
  shell_rc: .bashrc
  credentials_dir: .credentials

metadata:
  enabled: ${oc.decode:${oc.env:AGENT_METADATA_ENABLED,false}}
  gateway_url: ${oc.env:AGENT_GATEWAY_URL,""}
  agent_api_token: ${oc.env:AGENT_API_TOKEN,""}
  instance_credential: ${oc.env:AGENT_INSTANCE_CREDENTIAL,""}
  agent_config_id: ${oc.env:AGENT_CONFIG_ID,""}
  replica_id: "${oc.env:AGENT_REPLICA_ID,0}"
  exchange: ${oc.env:AGENT_METADATA_EXCHANGE,media.agent.metadata.v1}

instance:
  enabled: ${oc.decode:${oc.env:AGENT_INSTANCE_ENABLED,false}}
  environment_id: ${oc.env:AGENT_ENVIRONMENT_ID,""}
  namespace: ${oc.env:POD_NAMESPACE,""}
  resource_name: ${oc.env:POD_NAME,""}
  resource_uid: ${oc.env:POD_UID,""}
  bootstrap_proof_file: ${oc.env:AGENT_BOOTSTRAP_PROOF_FILE,/var/run/secrets/media-agent/identity-token}
  public_keys_file: ${oc.env:RUNTIME_PUBLIC_KEYS_FILE,/run/secrets/runtime-public-keys.json}
