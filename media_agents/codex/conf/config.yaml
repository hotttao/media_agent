agent:
  type: codex
  port: ${oc.env:PORT,3001}

capabilities:
  system_prompt: true
  mcp: true
  skills: false
  questions: false
  reconnect: true
  permissions: true
  streaming_deltas: true

codex:
  program: ${oc.env:CODEX_ACP_BIN,codex-acp}
  initial_agent_mode: ${oc.env:CODEX_INITIAL_AGENT_MODE,default}
  config_dir: ${oc.env:CODEX_CONFIG_DIR,/root/.codex}
  disable_response_storage: true
