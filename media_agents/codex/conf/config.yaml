# Codex agent 配置。omegaconf 从此文件加载，含 ${oc.env:VAR,default} 环境变量插值。
# AdapterConfig schema 定义在 adapter/config/config.py，未列字段用默认值。

agent_type: codex

capabilities:
  system_prompt: true
  mcp: true
  skills: false
  questions: false
  reconnect: true
  permissions: true
  streaming_deltas: true

workspace_dir: ${oc.env:WORKSPACE_DIR,/workspace}
keep_files: [AGENTS.md, runtime.json]
cp_url: ${oc.env:CP_URL,null}
workspace_id: ${oc.env:WORKSPACE_ID,null}

bridge_ttl:
  idle_ttl_ms: 600000      # 10 min
  max_count: 10
  evict_interval_ms: 60000

keepalive:
  interval_ms: 15000
