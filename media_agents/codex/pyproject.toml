[project]
name = "codex"
version = "0.1.0"
description = "Codex agent: uses adapter + codex-acp child process"
requires-python = ">=3.11"
dependencies = [
    # workspace 内部依赖：uv 会建 editable link
    "adapter",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "omegaconf",
    "pydantic>=2",
    "pydantic-settings",
    "tomli; python_version < '3.11'",
    "tomli-w",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codex"]
package-dir = {"codex" = "."}
