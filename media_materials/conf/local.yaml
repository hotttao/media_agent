app:
  name: media-materials
  version: v1
  env: ${APP_ENV:-local}

server:
  enabled: true
  address: ${SERVER_ADDR:-:8003}
  # Up to 256 MiB video plus multipart envelope; image workflow limit stays 16 MiB.
  max_request_body_bytes: 283115520

database:
  enabled: true
  driver: postgres
  dsn: ${POSTGRES_DSN:-postgres://media_auth:media_auth@127.0.0.1:5432/media-materials?sslmode=disable}
  max_open_conns: 50
  max_idle_conns: 10
  migrate_on_start: true

consul:
  enabled: ${CONSUL_ENABLED:-false}

consul_kv:
  enabled: ${CONSUL_KV_ENABLED:-false}

otel:
  enabled: ${OTEL_ENABLED:-false}

prometheus:
  enabled: ${PROMETHEUS_ENABLED:-false}

access_log:
  enabled: true
  format: "[${time}] ${status} - ${latency} ${method} ${path}"
  time_format: "2006-01-02T15:04:05Z"

log:
  enabled: true
  level: ${LOG_LEVEL:-debug}
  dir: ${LOG_DIR:-}
  filename: app.log
  max_size_mb: 100
  max_backups: 10
  max_age_days: 7
  compress: true
  console: true

recovery:
  enabled: true
  print_stack: true

request_id:
  enabled: true
  header: "X-Request-ID"

cors:
  enabled: true
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["*"]
  allow_credentials: false
  max_age_seconds: 600

pprof:
  enabled: true
  prefix: "/debug/pprof"

health:
  enabled: true
  path: "/health"

object_storage:
  enabled: true
  provider: ${MEDIA_STORAGE_PROVIDER:-s3}
  endpoint: ${MEDIA_STORAGE_ENDPOINT:-http://127.0.0.1:8333}
  public_endpoint: ${MEDIA_STORAGE_PUBLIC_ENDPOINT:-http://mini-001.local:8333}
  region: ${MEDIA_STORAGE_REGION:-us-east-1}
  bucket: ${MEDIA_STORAGE_BUCKET:-media}
  access_key: ${MEDIA_STORAGE_ACCESS_KEY:-media-materials}
  secret_key: ${MEDIA_STORAGE_SECRET_KEY:-media-materials-local-secret}
  force_path_style: ${MEDIA_STORAGE_FORCE_PATH_STYLE:-true}
  presign_ttl_seconds: ${MEDIA_STORAGE_PRESIGN_TTL_SECONDS:-300}


# auth 中间件配置（jwt_secret/jwt_expires 走 AuthConfig；其余走环境变量）
auth:
  jwt_secret: ${MW_JWT_SECRET:-mw-shared-secret-change-me}
  jwt_expires_in_seconds: 604800
  oauth_client_secret: ${MW_MATERIALS_OAUTH_CLIENT_SECRET:-mw_materials_secret_dev}

# 下游 client
client:
  media_auth:
    enabled: true
    service_name: "media-auth"
    base_domain: ${MEDIA_AUTH_URL:-http://127.0.0.1:8001}
    use_discovery: false

mcp_delegation:
  enabled: ${MEDIA_MCP_ENABLED:-false}
  issuer: ${MCP_DELEGATION_ISSUER:-}
  jwks_url: ${MCP_DELEGATION_JWKS_URL:-}
  service_token: ${MCP_MATERIALS_SERVICE_TOKEN:-}
