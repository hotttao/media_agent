services:
  media_materials:
    build:
      context: ..
      dockerfile: media_materials/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - ../docker-compose/.env.${INFRA:-unit}
    environment:
      SERVER_ADDR: ":8003"
      POSTGRES_DSN: postgres://media_auth:media_auth@host.docker.internal:5432/media-materials?sslmode=disable
      LOG_DIR: /media_logs/media-materials
      # auth 中间件配置
      JWT_SECRET: ${MW_JWT_SECRET:-mw-shared-secret-change-me}
      MW_OAUTH_CLIENT_SECRET: ${MW_MATERIALS_OAUTH_CLIENT_SECRET:-mw_materials_secret_dev}
      MEDIA_AUTH_URL: http://host.docker.internal:8001
    volumes:
      - ../media_logs/media-materials:/media_logs/media-materials
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
