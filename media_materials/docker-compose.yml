services:
  media_materials:
    build:
      context: ..
      dockerfile: media_materials/Dockerfile
    ports:
    - 8003:8003
    env_file:
    - ../docker-compose/.env.${INFRA:-unit}
    environment:
      POSTGRES_DSN: postgres://media_auth:media_auth@host.docker.internal:5432/media-materials?sslmode=disable
      MEDIA_AUTH_URL: http://media_auth:8001
      MEDIA_AUTH_INTERNAL_TOKEN: ${MEDIA_AUTH_INTERNAL_TOKEN:-dev-media-auth-internal-token}
      MEDIA_MATERIALS_INTERNAL_TOKEN: ${MEDIA_MATERIALS_INTERNAL_TOKEN:-dev-media-materials-internal-token}
      # Empty by default: historical import is disabled unless an operator supplies a secret.
      MEDIA_MATERIALS_MIGRATION_TOKEN: ${MEDIA_MATERIALS_MIGRATION_TOKEN:-}
      INTERNAL_JWKS_URL: http://host.docker.internal:18080/.well-known/jwks.json
      INTERNAL_JWT_ISSUER: http://oathkeeper:4456/
      AGENT_JWKS_URL: http://host.docker.internal:8006/internal/.well-known/agent-jwks.json
      AGENT_JWT_ISSUER: ${AGENT_JWT_ISSUER:-urn:media:agent-gateway}
      ORY_KRATOS_PUBLIC_URL: http://host.docker.internal:18080
      MEDIA_STORAGE_PROVIDER: s3
      MEDIA_STORAGE_ENDPOINT: http://media-storage:8333
      MEDIA_STORAGE_PUBLIC_ENDPOINT: ${MEDIA_STORAGE_PUBLIC_ENDPOINT:-http://192.168.2.41:8333}
      MEDIA_STORAGE_REGION: ${MEDIA_STORAGE_REGION:-us-east-1}
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-media}
      MEDIA_STORAGE_ACCESS_KEY: ${MEDIA_STORAGE_ACCESS_KEY:-media-materials}
      MEDIA_STORAGE_SECRET_KEY: ${MEDIA_STORAGE_SECRET_KEY:-media-materials-local-secret}
      MEDIA_STORAGE_FORCE_PATH_STYLE: "true"
      MEDIA_STORAGE_PRESIGN_TTL_SECONDS: "300"
      LOG_DIR: /media_logs/media-materials
    volumes:
    - ../media_logs/media-materials:/media_logs/media-materials
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks: [media-net]

networks:
  media-net:
    name: media-net
    external: true
