syntax = "proto3";

package media_control.platform_administration;

import "api.proto";
import "google/api/annotations.proto";

option go_package = "media_control/platform_administration";

service PlatformAdministrationService {
  rpc CreatePlatformSetting(CreatePlatformSettingRequest) returns (PlatformSettingResponse) {
    option (api.post) = "/api/v1/admin/platform-settings";
    option (google.api.http) = { post: "/api/v1/admin/platform-settings" body: "*" };
  }
  rpc ListPlatformSettings(ListPlatformSettingsRequest) returns (ListPlatformSettingsResponse) {
    option (api.get) = "/api/v1/admin/platform-settings";
    option (google.api.http) = { get: "/api/v1/admin/platform-settings" };
  }
  rpc GetPlatformSetting(GetPlatformSettingRequest) returns (PlatformSettingResponse) {
    option (api.get) = "/api/v1/admin/platform-settings/:setting_key";
    option (google.api.http) = { get: "/api/v1/admin/platform-settings/{setting_key}" };
  }
  rpc UpdatePlatformSetting(UpdatePlatformSettingRequest) returns (PlatformSettingResponse) {
    option (api.put) = "/api/v1/admin/platform-settings/:setting_key";
    option (google.api.http) = { put: "/api/v1/admin/platform-settings/{setting_key}" body: "*" };
  }
  rpc ReportClusterProjection(ReportClusterProjectionRequest) returns (ClusterProjectionResponse) {
    option (api.put) = "/api/v1/admin/clusters/:cluster_id/report";
    option (google.api.http) = { put: "/api/v1/admin/clusters/{cluster_id}/report" body: "*" };
  }
  rpc ListClusterProjections(ListClusterProjectionsRequest) returns (ListClusterProjectionsResponse) {
    option (api.get) = "/api/v1/admin/clusters";
    option (google.api.http) = { get: "/api/v1/admin/clusters" };
  }
  rpc GetClusterProjection(GetClusterProjectionRequest) returns (ClusterProjectionResponse) {
    option (api.get) = "/api/v1/admin/clusters/:cluster_id";
    option (google.api.http) = { get: "/api/v1/admin/clusters/{cluster_id}" };
  }
}

message CreatePlatformSettingRequest { string key = 1 [(api.body) = "key"]; string value_json = 2 [(api.body) = "value_json"]; }
message ListPlatformSettingsRequest {}
message GetPlatformSettingRequest { string setting_key = 1 [(api.path) = "setting_key"]; }
message UpdatePlatformSettingRequest { string setting_key = 1 [(api.path) = "setting_key"]; string value_json = 2 [(api.body) = "value_json"]; int64 expected_version = 3 [(api.body) = "expected_version"]; }
message PlatformSettingResponse { string key = 1; string value_json = 2; int64 version = 3; string updated_by = 4; int64 updated_at = 5; }
message ListPlatformSettingsResponse { repeated PlatformSettingResponse settings = 1; }
message ReportClusterProjectionRequest { string cluster_id = 1 [(api.path) = "cluster_id"]; string status = 2 [(api.body) = "status"]; string capacity_json = 3 [(api.body) = "capacity_json"]; int64 observed_at = 4 [(api.body) = "observed_at"]; }
message ListClusterProjectionsRequest {}
message GetClusterProjectionRequest { string cluster_id = 1 [(api.path) = "cluster_id"]; }
message ClusterProjectionResponse { string cluster_id = 1; string status = 2; string capacity_json = 3; int64 observed_at = 4; }
message ListClusterProjectionsResponse { repeated ClusterProjectionResponse clusters = 1; }
