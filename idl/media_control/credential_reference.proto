syntax = "proto3";

package media_control.credential_reference;

import "api.proto";
import "google/api/annotations.proto";

option go_package = "media_control/credential_reference";

service CredentialReferenceService {
  rpc CreateCredentialReference(CreateCredentialReferenceRequest) returns (CredentialReferenceResponse) {
    option (api.post) = "/api/v1/credential-references";
    option (google.api.http) = { post: "/api/v1/credential-references" body: "*" };
  }
  rpc ListCredentialReferences(ListCredentialReferencesRequest) returns (ListCredentialReferencesResponse) {
    option (api.get) = "/api/v1/credential-references";
    option (google.api.http) = { get: "/api/v1/credential-references" };
  }
  rpc GetCredentialReference(GetCredentialReferenceRequest) returns (CredentialReferenceResponse) {
    option (api.get) = "/api/v1/credential-references/:credential_id";
    option (google.api.http) = { get: "/api/v1/credential-references/{credential_id}" };
  }
  rpc UpdateCredentialReference(UpdateCredentialReferenceRequest) returns (CredentialReferenceResponse) {
    option (api.put) = "/api/v1/credential-references/:credential_id";
    option (google.api.http) = { put: "/api/v1/credential-references/{credential_id}" body: "*" };
  }
  rpc RevokeCredentialReference(RevokeCredentialReferenceRequest) returns (CredentialReferenceResponse) {
    option (api.post) = "/api/v1/credential-references/:credential_id/revoke";
    option (google.api.http) = { post: "/api/v1/credential-references/{credential_id}/revoke" body: "*" };
  }
}

message CreateCredentialReferenceRequest { string workspace_id = 1 [(api.body) = "workspace_id"]; string name = 2 [(api.body) = "name"]; string provider_id = 3 [(api.body) = "provider_id"]; string secret_ref = 4 [(api.body) = "secret_ref"]; }
message ListCredentialReferencesRequest { string workspace_id = 1 [(api.query) = "workspace_id"]; }
message GetCredentialReferenceRequest { string credential_id = 1 [(api.path) = "credential_id"]; }
message UpdateCredentialReferenceRequest { string credential_id = 1 [(api.path) = "credential_id"]; string name = 2 [(api.body) = "name"]; string provider_id = 3 [(api.body) = "provider_id"]; string secret_ref = 4 [(api.body) = "secret_ref"]; int64 expected_version = 5 [(api.body) = "expected_version"]; }
message RevokeCredentialReferenceRequest { string credential_id = 1 [(api.path) = "credential_id"]; int64 expected_version = 2 [(api.body) = "expected_version"]; }
message CredentialReferenceResponse { string id = 1; string workspace_id = 2; string name = 3; string provider_id = 4; string status = 5; int64 version = 6; int64 created_at = 7; int64 updated_at = 8; }
message ListCredentialReferencesResponse { repeated CredentialReferenceResponse credentials = 1; }
