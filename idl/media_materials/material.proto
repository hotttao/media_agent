syntax = "proto3";

package media_materials.material;

import "api.proto";
import "google/api/annotations.proto";

option go_package = "media_materials/material";

service MaterialService {
  rpc CreateMaterial(CreateMaterialReq) returns (Material) {
    option (google.api.http) = { post: "/api/v1/materials" body: "*" };
    option (api.post) = "/api/v1/materials";
  }
  rpc GetMaterial(GetMaterialReq) returns (Material) {
    option (google.api.http) = { get: "/api/v1/materials/{id}" };
    option (api.get) = "/api/v1/materials/:id";
  }
  rpc ListMaterials(ListMaterialsReq) returns (ListMaterialsResp) {
    option (google.api.http) = { get: "/api/v1/materials" };
    option (api.get) = "/api/v1/materials";
  }
  rpc UpdateMaterial(UpdateMaterialReq) returns (Material) {
    option (google.api.http) = { put: "/api/v1/materials/{id}" body: "*" };
    option (api.put) = "/api/v1/materials/:id";
  }
  rpc DeleteMaterial(GetMaterialReq) returns (Material) {
    option (google.api.http) = { delete: "/api/v1/materials/{id}" };
    option (api.delete) = "/api/v1/materials/:id";
  }
}

message Material {
  string id = 1;
  string organization_id = 2;
  string scope = 3;
  string name = 4;
  string description = 5;
  string prompt = 6;
  string asset_kind = 7;
  string object_path = 8;
  string content = 9;
  string metadata = 10;
  string owner_user_id = 11;
  string visibility = 12;
  string team_id = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
}

message CreateMaterialReq {
  string organization_id = 1 [(api.query) = "organization_id"];
  string scope = 2 [(api.query) = "scope"];
  string name = 3 [(api.body) = "name"];
  string description = 4 [(api.body) = "description"];
  string prompt = 5 [(api.body) = "prompt"];
  string asset_kind = 6 [(api.body) = "asset_kind"];
  string object_path = 7 [(api.body) = "object_path"];
  string content = 8 [(api.body) = "content"];
  string metadata = 9 [(api.body) = "metadata"];
  string visibility = 10 [(api.body) = "visibility"];
  string team_id = 11 [(api.body) = "team_id"];
}

message GetMaterialReq {
  string id = 1 [(api.path) = "id"];
  string organization_id = 2 [(api.query) = "organization_id"];
}

message ListMaterialsReq {
  string organization_id = 1 [(api.query) = "organization_id"];
  string scope = 2 [(api.query) = "scope"];
  string asset_kind = 3 [(api.query) = "asset_kind"];
  optional bool only_mine = 4 [(api.query) = "only_mine"];
  string visibility = 5 [(api.query) = "visibility"];
  int32 page = 6 [(api.query) = "page"];
  int32 page_size = 7 [(api.query) = "page_size"];
}

message ListMaterialsResp { repeated Material items = 1; int32 total = 2; }

message UpdateMaterialReq {
  string id = 1 [(api.path) = "id"];
  string organization_id = 2 [(api.query) = "organization_id"];
  string name = 3 [(api.body) = "name"];
  string description = 4 [(api.body) = "description"];
  string prompt = 5 [(api.body) = "prompt"];
  string object_path = 6 [(api.body) = "object_path"];
  string content = 7 [(api.body) = "content"];
  string metadata = 8 [(api.body) = "metadata"];
  string visibility = 9 [(api.body) = "visibility"];
  string team_id = 10 [(api.body) = "team_id"];
}
