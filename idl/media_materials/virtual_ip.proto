syntax = "proto3";
package media_materials.virtual_ip;
import "api.proto";
import "google/api/annotations.proto";
option go_package = "media_materials/virtual_ip";

service VirtualIpService {
  rpc CreateVirtualIp(CreateVirtualIpReq) returns (VirtualIp) { option (google.api.http) = { post: "/api/v1/virtual-ips" body: "*" }; option (api.post) = "/api/v1/virtual-ips"; }
  rpc GetVirtualIp(GetVirtualIpReq) returns (VirtualIp) { option (google.api.http) = { get: "/api/v1/virtual-ips/{id}" }; option (api.get) = "/api/v1/virtual-ips/:id"; }
  rpc ListVirtualIps(ListVirtualIpsReq) returns (ListVirtualIpsResp) { option (google.api.http) = { get: "/api/v1/virtual-ips" }; option (api.get) = "/api/v1/virtual-ips"; }
  rpc UpdateVirtualIp(UpdateVirtualIpReq) returns (VirtualIp) { option (google.api.http) = { put: "/api/v1/virtual-ips/{id}" body: "*" }; option (api.put) = "/api/v1/virtual-ips/:id"; }
  rpc ArchiveVirtualIp(GetVirtualIpReq) returns (VirtualIp) { option (google.api.http) = { post: "/api/v1/virtual-ips/{id}/archive" }; option (api.post) = "/api/v1/virtual-ips/:id/archive"; }
  rpc DeleteVirtualIp(GetVirtualIpReq) returns (VirtualIp) { option (google.api.http) = { delete: "/api/v1/virtual-ips/{id}" }; option (api.delete) = "/api/v1/virtual-ips/:id"; }
}

message VirtualIp {
  string id = 1; string organization_id = 2; string scope = 3; string name = 4; string description = 5;
  string avatar_object_path = 6; string full_body_object_path = 7; string three_view_object_path = 8; string nine_view_object_path = 9;
  string persona_profile = 10; string status = 11; string visibility = 12; string owner_user_id = 13;
  int64 created_at = 14; int64 updated_at = 15;
}
message CreateVirtualIpReq {
  string organization_id = 1 [(api.query) = "organization_id"]; string scope = 2 [(api.query) = "scope"];
  string name = 3; string description = 4; string avatar_object_path = 5; string full_body_object_path = 6;
  string three_view_object_path = 7; string nine_view_object_path = 8; string persona_profile = 9; string visibility = 10;
}
message GetVirtualIpReq { string id = 1 [(api.path) = "id"]; string organization_id = 2 [(api.query) = "organization_id"]; }
message ListVirtualIpsReq {
  string organization_id = 1 [(api.query) = "organization_id"]; string scope = 2 [(api.query) = "scope"];
  string name = 3 [(api.query) = "name"]; string status = 4 [(api.query) = "status"];
  string visibility = 5 [(api.query) = "visibility"]; int32 page = 6 [(api.query) = "page"]; int32 page_size = 7 [(api.query) = "page_size"];
}
message ListVirtualIpsResp { repeated VirtualIp items = 1; int32 total = 2; }
message UpdateVirtualIpReq {
  string id = 1 [(api.path) = "id"]; string organization_id = 2 [(api.query) = "organization_id"];
  string name = 3; string description = 4; string avatar_object_path = 5; string full_body_object_path = 6;
  string three_view_object_path = 7; string nine_view_object_path = 8; string persona_profile = 9;
}
