syntax = "proto3";

package media_materials.generated_asset;

import "api.proto";
import "google/api/annotations.proto";

option go_package = "media_materials/generated_asset";

// GeneratedAssetService —— workflow 产物。
// 创建由 media_workflow 调 UpsertGeneratedAsset（内部 RPC）；前端只读 + 删。
service GeneratedAssetService {
  rpc GetGeneratedAsset(GetGeneratedAssetReq) returns (GeneratedAsset) {
    option (google.api.http) = { get: "/api/v1/generated-assets/{id}" };
    option (api.get) = "/api/v1/generated-assets/:id";
  }
  rpc ListGeneratedAssets(ListGeneratedAssetsReq) returns (ListGeneratedAssetsResp) {
    option (google.api.http) = { get: "/api/v1/generated-assets" };
    option (api.get) = "/api/v1/generated-assets";
  }
  // ListGeneratedAssetsBySource —— 给编排层组装 bundle 用：按 source virtual_ip / product 列出产物。
  rpc ListGeneratedAssetsBySource(ListGeneratedAssetsBySourceReq) returns (ListGeneratedAssetsBySourceResp) {
    option (google.api.http) = { get: "/api/v1/generated-assets/by-source" };
    option (api.get) = "/api/v1/generated-assets/by-source";
  }
  rpc DeleteGeneratedAsset(GetGeneratedAssetReq) returns (GeneratedAsset) {
    option (google.api.http) = { delete: "/api/v1/generated-assets/{id}" };
    option (api.delete) = "/api/v1/generated-assets/:id";
  }
  // UpsertGeneratedAsset —— 内部 RPC（被 media_workflow execution 期调用），不暴露给前端。
  rpc UpsertGeneratedAsset(UpsertGeneratedAssetReq) returns (UpsertGeneratedAssetResp) {
    option (google.api.http) = { post: "/api/internal/v1/generated-assets:upsert" body: "*" };
    option (api.post) = "/api/internal/v1/generated-assets:upsert";
  }
  // ImportGeneratedAsset —— 迁移专用内部接口，历史产物不伪造 Job/StepRun。
  rpc ImportGeneratedAsset(ImportGeneratedAssetReq) returns (ImportGeneratedAssetResp) {
    option (google.api.http) = { post: "/api/internal/v1/generated-assets/import" body: "*" };
    option (api.post) = "/api/internal/v1/generated-assets/import";
  }
  // GetImportedGeneratedAsset —— 供 media_workflow 校验历史 StepRun 所引用的真实资产。
  rpc GetImportedGeneratedAsset(GetGeneratedAssetReq) returns (ImportedGeneratedAsset) {
    option (google.api.http) = { get: "/api/internal/v1/generated-assets/import/{id}" };
    option (api.get) = "/api/internal/v1/generated-assets/import/:id";
  }
}

message GeneratedAsset {
  string id = 1;
  string scope = 2;
  string name = 3;
  string asset_kind = 4;                  // resource_type=ASSET
  string url = 5;
  string content = 6;                     // TEXT 产物
  string owner_user_id = 7;               // = job.submitted_by
  string visibility = 8;
  string team_id = 9;
  string job_id = 10;                     // → media_workflow.jobs.id
  string step_run_id = 11;                // → media_workflow.step_runs.id
  string template_id = 12;
  int32 template_version = 13;
  string source_virtual_ip_id = 14;
  string source_product_id = 15;
  int64 created_at = 16;
  string object_path = 17;
  string origin = 18;
  string source_system = 19;
  string source_record_id = 20;
}

message GetGeneratedAssetReq {
  string id = 1 [(api.path) = "id"];
}

message ListGeneratedAssetsReq {
  string scope = 1 [(api.query) = "scope"];
  string asset_kind = 2 [(api.query) = "asset_kind"];
  string owner = 3 [(api.query) = "owner"];
  string job_id = 4 [(api.query) = "job_id"];
  string source_virtual_ip_id = 5 [(api.query) = "source_virtual_ip_id"];
  string source_product_id = 6 [(api.query) = "source_product_id"];
  int32 page = 7 [(api.query) = "page"];
  int32 page_size = 8 [(api.query) = "page_size"];
}

message ListGeneratedAssetsResp {
  repeated GeneratedAsset items = 1;
  int32 total = 2;
}

message ListGeneratedAssetsBySourceReq {
  string source_kind = 1 [(api.query) = "source_kind"];   // virtual_ip / product
  string source_id = 2 [(api.query) = "source_id"];
}

message ListGeneratedAssetsBySourceResp {
  repeated GeneratedAsset items = 1;
}

message UpsertGeneratedAssetReq {
  string scope = 1;
  string asset_kind = 2;                  // = template.output_asset_kind
  string name = 3;
  string url = 4;
  string content = 5;
  string owner_user_id = 6;               // = job.submitted_by
  string visibility = 7;                  // 默认 private
  string team_id = 8;
  string job_id = 9;
  string step_run_id = 10;
  string template_id = 11;
  int32 template_version = 12;
  string source_virtual_ip_id = 13;
  string source_product_id = 14;
}

message UpsertGeneratedAssetResp {
  string id = 1;
}

message ImportGeneratedAssetReq {
  string organization_id = 1;
  string scope = 2;
  string asset_kind = 3;
  string name = 4;
  string object_path = 5;
  string owner_user_id = 6;
  string source_system = 7;
  string source_record_id = 8;
  string source_sha256 = 9;
  int64 source_created_at = 10; // Unix nanoseconds
  string source_virtual_ip_id = 11;
  string source_product_id = 12;
}

message ImportGeneratedAssetResp {
  string id = 1;
  string object_path = 2;
}

message ImportedGeneratedAsset {
  string id = 1;
  string organization_id = 2;
  string scope = 3;
  string owner_user_id = 4;
  string asset_kind = 5;
  string object_path = 6;
  string source_system = 7;
  string source_record_id = 8;
  string source_sha256 = 9;
  int64 source_created_at = 10;
  string source_product_id = 11;
  string source_virtual_ip_id = 12;
  string access_url = 13; // Short-lived; resolve again when a Worker claims the task.
  int64 access_expires_at = 14;
}
