syntax = "proto3";

package media_auth.token;

import "api.proto";

// Hertz 工具链:
//   make hz-model     -> hertz_gen/model/media_auth/token/token.pb.go
//   make hz-client    -> hertz_gen/media_auth/token_service.go            (供下游服务调用)
//   make hz-update    -> media_auth/biz/handler/token/token_service.go   (handler 骨架)
//
// **internal service —— 不挂网关路由,不出 OpenAPI。**
// 网络隔离 / mTLS 由部署层负责（反代 / service mesh / 网络策略），不在 app 范围。
// 本 proto 只写 (api.post) 给 hz 生成路由用,不写 google.api.http(不进 swagger)。
option go_package = "media_auth/token";

// TokenService —— 供下游服务验证 opaque Bearer service token。
//
// service token 是 opaque(仅存 SHA-256 hash),下游无法本地验,故调本接口。
// 明文 token 永不出 media_auth 边界（内部 sha256 后查 service_tokens.token_hash）。
// cookie / bearer JWT 由各服务用共享 JWT_SECRET 本地 HS256 验,不走本接口。
service TokenService {
  // POST /internal/token/verify —— 校验 token 并解析为鉴权主体
  rpc VerifyToken(VerifyTokenRequest) returns(VerifyTokenResponse) {
    option (api.post) = "/internal/token/verify";
  };
}

message VerifyTokenRequest {
  // tos_xxx 明文;media_auth 内部 sha256 后查 service_tokens.token_hash,
  // 明文永不出 media_auth 边界。
  string token = 1;
  // 可选提示,目前固定 service_token;预留未来统一校验 JWT。
  string token_type_hint = 2;
}

message VerifyTokenResponse {
  bool active = 1;
  // = service_tokens.created_by（调用方据此识别 token 持有者）
  string sub = 2;
  // svc:{name}
  string username = 3;
  string name = 4;
  // 固定 user
  string role = 5;
  // service_token
  string token_type = 6;
}
