syntax = "proto3";

package media_auth.token;

import "api.proto";

// Hertz 工具链:
//   make hz-model     -> hertz_gen/model/media_auth/token/token.pb.go
//   make hz-client    -> hertz_gen/media_auth/token_service.go            (供下游服务调用)
//   make hz-update    -> media_auth/biz/handler/token/token_service.go   (handler 骨架)
//
// **internal service —— 不挂网关路由,不出 OpenAPI。**
// 网络隔离 / mTLS 由部署层负责（反代 / service mesh / 网络策略），不在 app 范围。
// 本 proto 只写 (api.post) 给 hz 生成路由用,不写 google.api.http(不进 swagger)。
option go_package = "media_auth/token";

// TokenService provides private session and Talos API Token introspection.
// Platform custody uses its separate mTLS service, not these endpoints.
service TokenService {
  rpc VerifySession(VerifySessionRequest) returns(VerifySessionResponse) {
    option (api.post) = "/internal/token/session";
  };
  // POST /internal/token/api-token:verify —— 通过 Talos 验证 API Token，返回委托主体。
  rpc VerifyApiToken(VerifyApiTokenRequest) returns(VerifyApiTokenResponse) {
    option (api.post) = "/internal/token/api-token:verify";
  };
}

message VerifySessionRequest { string token = 1; }

message VerifyApiTokenRequest { string token = 1; }

message VerifyApiTokenResponse {
  bool active = 1;
  string sub = 2;
  string actor_type = 3;
  string actor_id = 4;
  string credential_id = 5;
  string organization_id = 6;
  string scope = 7;
  int64 exp = 8;
  string auth_source = 9;
  // Oathkeeper exposes non-standard introspection claims to mutator templates
  // through Extra when they are carried in Oathkeeper's `ext` object.
  map<string, string> ext = 10;
}

message VerifySessionResponse {
  bool active = 1;
  // Business User ID; field numbers preserve the session wire contract.
  string sub = 2;
  string username = 3;
  string name = 4;
  string role = 5;
  // session
  string token_type = 6;
  reserved 7 to 12;
  reserved "credential_id", "organization_id", "scope", "exp", "auth_source", "ext";
}
