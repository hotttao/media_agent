syntax = "proto3";
package media_auth.organization;

import "api.proto";
import "google/api/annotations.proto";
option go_package = "media_auth/organization";

service OrganizationService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (google.api.http) = { get: "/api/organizations" };
    option (api.get) = "/api/organizations";
  }
  rpc CreateOrganization(CreateOrganizationRequest) returns (ApiOrganization) {
    option (google.api.http) = { post: "/api/organizations" body: "*" };
    option (api.post) = "/api/organizations";
  }
  rpc GetOrganization(GetOrganizationRequest) returns (ApiOrganization) {
    option (google.api.http) = { get: "/api/organizations/{id}" };
    option (api.get) = "/api/organizations/:id";
  }
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (ApiOrganization) {
    option (google.api.http) = { patch: "/api/organizations/{id}" body: "*" };
    option (api.patch) = "/api/organizations/:id";
  }
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = { get: "/api/organizations/{id}/members" };
    option (api.get) = "/api/organizations/:id/members";
  }
  rpc AddMember(AddMemberRequest) returns (ApiOrganizationMember) {
    option (google.api.http) = { post: "/api/organizations/{id}/members" body: "*" };
    option (api.post) = "/api/organizations/:id/members";
  }
  rpc UpdateMember(UpdateMemberRequest) returns (ApiOrganizationMember) {
    option (google.api.http) = { patch: "/api/organizations/{id}/members/{user_id}" body: "*" };
    option (api.patch) = "/api/organizations/:id/members/:user_id";
  }
  rpc RemoveMember(RemoveMemberRequest) returns (MutationResponse) {
    option (google.api.http) = { delete: "/api/organizations/{id}/members/{user_id}" };
    option (api.delete) = "/api/organizations/:id/members/:user_id";
  }
  rpc GetEntitlements(GetEntitlementsRequest) returns (EntitlementsResponse) {
    option (google.api.http) = { get: "/api/organizations/{id}/entitlements" };
    option (api.get) = "/api/organizations/:id/entitlements";
  }
  rpc SetEntitlements(SetEntitlementsRequest) returns (EntitlementsResponse) {
    option (google.api.http) = { put: "/api/organizations/{id}/entitlements" body: "*" };
    option (api.put) = "/api/organizations/:id/entitlements";
  }
}

message ListOrganizationsRequest {}
message ListOrganizationsResponse { repeated ApiOrganization organizations = 1; }
message CreateOrganizationRequest { string name = 1; }
message GetOrganizationRequest { string id = 1 [(api.path) = "id"]; }
message UpdateOrganizationRequest {
  string id = 1 [(api.path) = "id"];
  optional string name = 2;
  optional string status = 3;
}
message ListMembersRequest { string id = 1 [(api.path) = "id"]; }
message ListMembersResponse { repeated ApiOrganizationMember members = 1; }
message AddMemberRequest {
  string id = 1 [(api.path) = "id"];
  string user_id = 2;
  optional string role = 3;
}
message UpdateMemberRequest {
  string id = 1 [(api.path) = "id"];
  string user_id = 2 [(api.path) = "user_id"];
  string role = 3;
}
message RemoveMemberRequest {
  string id = 1 [(api.path) = "id"];
  string user_id = 2 [(api.path) = "user_id"];
}
message GetEntitlementsRequest { string id = 1 [(api.path) = "id"]; }
message SetEntitlementsRequest {
  string id = 1 [(api.path) = "id"];
  repeated string feature_keys = 2;
}
message MutationResponse { bool success = 1; }
message EntitlementsResponse { repeated string feature_keys = 1; }

message ApiOrganization {
  string id = 1;
  string name = 2;
  string status = 3;
  int64 version = 4;
  string my_role = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ApiOrganizationMember {
  string user_id = 1;
  string user_name = 2;
  string role = 3;
  string joined_at = 4;
}
