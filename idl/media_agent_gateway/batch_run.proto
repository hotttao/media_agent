syntax = "proto3";

package media_agent_gateway.batch_run;

import "api.proto";
import "google/api/annotations.proto";

option go_package = "media_agent_gateway/batch_run";

service BatchRunService {
  rpc CreateBatchRun(CreateBatchRunRequest) returns (BatchRunResponse) {
    option (api.post) = "/api/v1/batch-runs";
    option (google.api.http) = { post: "/api/v1/batch-runs" body: "*" };
  }
  rpc ListBatchRuns(ListBatchRunsRequest) returns (ListBatchRunsResponse) {
    option (api.get) = "/api/v1/batch-runs";
    option (google.api.http) = { get: "/api/v1/batch-runs" };
  }
  rpc GetBatchRun(GetBatchRunRequest) returns (BatchRunResponse) {
    option (api.get) = "/api/v1/batch-runs/:batch_run_id";
    option (google.api.http) = { get: "/api/v1/batch-runs/{batch_run_id}" };
  }
  rpc CancelBatchRun(CancelBatchRunRequest) returns (BatchRunResponse) {
    option (api.post) = "/api/v1/batch-runs/:batch_run_id/cancel";
    option (google.api.http) = { post: "/api/v1/batch-runs/{batch_run_id}/cancel" body: "*" };
  }
}

message CreateBatchRunRequest {
  string workspace_id = 1 [(api.body) = "workspace_id"];
  string idempotency_key = 2 [(api.body) = "idempotency_key"];
  repeated CreateBatchRunItem items = 3 [(api.body) = "items"];
}
message CreateBatchRunItem { string item_key = 1; string session_id = 2; string input_json = 3; }
message ListBatchRunsRequest { string workspace_id = 1 [(api.query) = "workspace_id"]; string status = 2 [(api.query) = "status"]; }
message GetBatchRunRequest { string batch_run_id = 1 [(api.path) = "batch_run_id"]; }
message CancelBatchRunRequest { string batch_run_id = 1 [(api.path) = "batch_run_id"]; }
message BatchRunItemResponse {
  string item_key = 1; string session_id = 2; string agent_task_id = 3; string input_json = 4;
  string status = 5; string error_code = 6; int64 created_at = 7; int64 updated_at = 8;
}
message BatchRunResponse {
  string id = 1; string workspace_id = 2; string requested_by = 3; string idempotency_key = 4;
  string status = 5; int32 item_count = 6; int32 next_cursor = 7;
  int32 completed_count = 8; int32 failed_count = 9; int32 cancelled_count = 10;
  int64 created_at = 11; int64 finished_at = 12; int64 updated_at = 13;
  repeated BatchRunItemResponse items = 14;
}
message ListBatchRunsResponse { repeated BatchRunResponse batch_runs = 1; }
