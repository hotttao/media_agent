syntax = "proto3";
package media_agent_gateway.agent_metadata;
import "api.proto";
import "google/api/annotations.proto";
option go_package = "media_agent_gateway/agent_metadata";
message ResourceReference { string kind = 1; string id = 2; int64 version = 3; string checksum = 4; }
message MetadataResource { string kind = 1; string id = 2; int64 version = 3; string name = 4; string checksum = 5; string content_ref = 6; string content = 7; }
message MetadataContext { int32 metadata_schema_version = 1; string workspace_id = 2; string agent_config_id = 3; int64 selection_revision = 4; string target_context_version = 5; int64 context_version = 6; string agent_type = 7; string configured_prompt = 8; repeated MetadataResource resources = 9; string status = 10; string platform_prompt = 11; string platform_prompt_template_version = 12; }
message ApplicationResult { string report_id = 1; string workspace_id = 2; string agent_config_id = 3; int64 selection_revision = 4; string target_context_version = 5; string replica_id = 6; string incarnation_id = 7; string status = 8; string applied_context_version = 9; string error_code = 10; }
message ResultResponse { bool accepted = 1; }
message ArtifactResponse { bytes content = 1; string checksum = 2; }
message InstanceView { string workspace_id = 1; string agent_config_id = 2; string replica_id = 3; string incarnation_id = 4; string admission = 5; }
message ContextRequest { string workspace_id = 1 [(api.query) = "workspace_id"]; string agent_config_id = 2 [(api.query) = "agent_config_id"]; int64 selection_revision = 3 [(api.query) = "selection_revision"]; string target_context_version = 4 [(api.query) = "target_context_version"]; string replica_id = 5 [(api.query) = "replica_id"]; string incarnation_id = 6 [(api.query) = "incarnation_id"]; bool for_session = 7 [(api.query) = "for_session"]; }
message GetArtifactRequest { string checksum = 1 [(api.path) = "checksum"]; string workspace_id = 2 [(api.query) = "workspace_id"]; string agent_config_id = 3 [(api.query) = "agent_config_id"]; string target_context_version = 4 [(api.query) = "target_context_version"]; string replica_id = 5 [(api.query) = "replica_id"]; string incarnation_id = 6 [(api.query) = "incarnation_id"]; }
message InstancesRequest { string workspace_id = 1 [(api.query) = "workspace_id"]; }
message InstancesResponse { repeated InstanceView instances = 1; bool membership_complete = 2; }
service AgentMetadataService {
 rpc GetRuntimeMetadata(ContextRequest) returns (MetadataContext) { option (api.get) = "/api/agent/v1/runtime-context"; option (google.api.http) = { get: "/api/agent/v1/runtime-context" }; }
 rpc ReportMetadataResult(ApplicationResult) returns (ResultResponse) { option (api.post) = "/api/agent/v1/metadata-results"; option (google.api.http) = { post: "/api/agent/v1/metadata-results" body: "*" }; }
 rpc GetMetadataArtifact(GetArtifactRequest) returns (ArtifactResponse) { option (api.get) = "/api/agent/v1/metadata-artifacts/:checksum"; option (google.api.http) = { get: "/api/agent/v1/metadata-artifacts/{checksum}" }; }
 rpc ListMetadataInstances(InstancesRequest) returns (InstancesResponse) { option (api.get) = "/internal/agent-metadata/instances"; option (google.api.http) = { get: "/internal/agent-metadata/instances" }; }
}
