syntax = "proto3";

package media_agent_gateway.chat;

import "api.proto";
import "google/api/annotations.proto";

option go_package = "media_agent_gateway/chat";

service ChatService {
  rpc CreateSession(CreateSessionRequest) returns (SessionResponse) {
    option (api.post) = "/api/chat/sessions";
    option (google.api.http) = { post: "/api/chat/sessions" body: "*" };
  }

  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (api.get) = "/api/chat/sessions";
    option (google.api.http) = { get: "/api/chat/sessions" };
  }

  rpc GetDefaultSession(GetDefaultSessionRequest) returns (SessionResponse) {
    option (api.get) = "/api/chat/session";
    option (google.api.http) = { get: "/api/chat/session" };
  }

  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (api.get) = "/api/chat/sessions/:session_id/messages";
    option (google.api.http) = { get: "/api/chat/sessions/{session_id}/messages" };
  }

  rpc RunTurn(RunTurnRequest) returns (RunTurnResponse) {
    option (api.post) = "/api/chat/sessions/:session_id/turns";
    option (google.api.http) = {
      post: "/api/chat/sessions/{session_id}/turns"
      body: "*"
    };
  }

  rpc InterruptTurn(InterruptTurnRequest) returns (InterruptTurnResponse) {
    option (api.post) = "/api/chat/sessions/:session_id/interrupt";
    option (google.api.http) = {
      post: "/api/chat/sessions/{session_id}/interrupt"
      body: "*"
    };
  }

  rpc SubscribeEvents(SubscribeEventsRequest) returns (SubscribeEventsResponse) {
    option (api.get) = "/api/chat/sessions/:session_id/events";
    option (google.api.http) = { get: "/api/chat/sessions/{session_id}/events" };
  }

  rpc ListAgentRequests(ListAgentRequestsRequest) returns (ListAgentRequestsResponse) {
    option (api.get) = "/api/chat/sessions/:session_id/requests";
    option (google.api.http) = { get: "/api/chat/sessions/{session_id}/requests" };
  }

  rpc ResolveAgentRequest(ResolveAgentRequestRequest) returns (AgentRequestResponse) {
    option (api.post) = "/api/chat/sessions/:session_id/turns/:turn_id/requests/:request_id/resolve";
    option (google.api.http) = {
      post: "/api/chat/sessions/{session_id}/turns/{turn_id}/requests/{request_id}/resolve"
      body: "*"
    };
  }
}

message GetDefaultSessionRequest {}

message CreateSessionRequest {
  string workspace_id = 1 [(api.body) = "workspace_id"];
  string title = 2 [(api.body) = "title"];
}

message ListSessionsRequest {
  string workspace_id = 1 [(api.query) = "workspace_id"];
}

message ListSessionsResponse {
  repeated SessionResponse sessions = 1;
}

message SessionResponse {
  string id = 1;
  string workspace_id = 2;
  string agent_id = 3;
  string status = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  string title = 7;
  string agent_type = 8;
  string chat_status = 9;
  int64 context_version = 10;
  string runtime_status = 11;
  int64 execution_epoch = 12;
}

message ListMessagesRequest {
  string session_id = 1 [(api.path) = "session_id"];
}

message MessageResponse {
  string id = 1;
  string turn_id = 2;
  string role = 3;
  string content_json = 4;
  int64 sequence = 5;
  int64 created_at = 6;
}

message ListMessagesResponse {
  repeated MessageResponse messages = 1;
}

message RunTurnRequest {
  string session_id = 1 [(api.path) = "session_id"];
  string message = 2 [(api.body) = "message"];
  string idempotency_key = 3 [(api.body) = "idempotency_key"];
}

message RunTurnResponse {
  string turn_id = 1;
  string status = 2;
}

message InterruptTurnRequest {
  string session_id = 1 [(api.path) = "session_id"];
}

message InterruptTurnResponse {
  string turn_id = 1;
  string status = 2;
}

message SubscribeEventsRequest {
  string session_id = 1 [(api.path) = "session_id"];
  int64 after_sequence = 2 [(api.query) = "after_sequence"];
}

// SubscribeEvents is transported as text/event-stream.
message SubscribeEventsResponse {}

message ListAgentRequestsRequest {
  string session_id = 1 [(api.path) = "session_id"];
  string turn_id = 2 [(api.query) = "turn_id"];
}

message ResolveAgentRequestRequest {
  string session_id = 1 [(api.path) = "session_id"];
  string turn_id = 2 [(api.path) = "turn_id"];
  string request_id = 3 [(api.path) = "request_id"];
  string response_json = 4 [(api.body) = "response_json"];
}

message AgentRequestResponse {
  string request_id = 1;
  string turn_id = 2;
  string request_type = 3;
  string payload_json = 4;
  string status = 5;
  string response_json = 6;
  int64 created_at = 7;
  int64 resolved_at = 8;
}

message ListAgentRequestsResponse {
  repeated AgentRequestResponse requests = 1;
}
