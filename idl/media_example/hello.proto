// idl/media_example/hello.proto
syntax = "proto3";

package hello;

option go_package = "media_example/hello";

import "api.proto";
import "google/api/annotations.proto";

message HelloReq {
   string Name = 1[(api.query)="name"];
}

message HelloResp {
   string RespBody = 1;
}

service HelloService {
   rpc Method1(HelloReq) returns(HelloResp) {
      option (api.get) = "/hello";
      option (google.api.http) = { get: "/hello" };
   }
}