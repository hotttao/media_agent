syntax = "proto3";

package media_storage.object;

import "api.proto";
import "google/api/annotations.proto";

option go_package = "media_storage/object";

service StorageInternalService {
  rpc PutObject(PutObjectReq) returns (PutObjectResp) {
    option (google.api.http) = { put: "/api/internal/v1/objects" };
    option (api.put) = "/api/internal/v1/objects";
  }
}

message PutObjectReq {
  string object_path = 1 [(api.query) = "object_path"];
}

message PutObjectResp {
  string object_path = 1;
  int64 size_bytes = 2;
  string content_type = 3;
  string checksum = 4;
}
