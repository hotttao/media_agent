# media-cli/conf/dev.yaml — dev / staging / prod-like 部署配置
#
# 语义：dev = 「只开可观测」。
#   - 没有 server/database/redis/consul 等段；
#   - client.* 可不填（CLI 在 dev 下主要做 trace / 日志验证，不一定打真实被测服务）；
#   - 如确需在 dev 打被测服务，在 client.<name> 段补全即可（enabled=true）。
#
# 与 local.yaml 的差别：local 默认带 client.media_example 全套治理，dev 默认空。

app:
  name: media-cli
  version: v1
  env: ${APP_ENV:-dev}

# ---- 可观测（dev 唯一保留的能力） ----
otel:
  enabled: true
  export_endpoint: ${OTEL_EXPORT_ENDPOINT:-otel-collector:4317}
  insecure: true
  sample_ratio: 1.0

log:
  enabled: true
  level: ${LOG_LEVEL:-info}
  dir: ${LOG_DIR:-}
  filename: app.log
  max_size_mb: 100
  max_backups: 10
  max_age_days: 7
  compress: true
  console: true

# ---- 被测 client（dev 默认空；需要时按 local.yaml 模式补全） ----
client:

  media_storage:
    enabled: true
    service_name: media-storage
    base_domain: ${MEDIA_STORAGE_ADDR:-http://127.0.0.1:8008}
    use_discovery: false
    timeout:
      enabled: true
      connect_timeout_ms: 200
      read_timeout_ms: 5000
      write_timeout_ms: 5000
      request_timeout_ms: 10000

  media_control:
    enabled: true
    service_name: media-control
    base_domain: ${MEDIA_CONTROL_ADDR:-http://127.0.0.1:8007}
    use_discovery: false
    timeout:
      enabled: true
      connect_timeout_ms: 200
      read_timeout_ms: 5000
      write_timeout_ms: 5000
      request_timeout_ms: 10000

  media_agent_gateway:
    enabled: true
    service_name: media-agent-gateway
    base_domain: ${MEDIA_AGENT_GATEWAY_ADDR:-http://127.0.0.1:8006}
    use_discovery: false
    timeout:
      enabled: true
      connect_timeout_ms: 200
      read_timeout_ms: 5000
      write_timeout_ms: 5000
      request_timeout_ms: 10000

  media_gen:
    enabled: true
    service_name: media-gen
    base_domain: ${MEDIA_GEN_ADDR:-http://127.0.0.1:8005}
    use_discovery: false
    timeout:
      enabled: true
      connect_timeout_ms: 200
      read_timeout_ms: 5000
      write_timeout_ms: 5000
      request_timeout_ms: 10000

  media_materials:
    enabled: true
    service_name: media-materials
    base_domain: ${MEDIA_MATERIALS_ADDR:-http://127.0.0.1:8003}
    use_discovery: false
    timeout:
      enabled: true
      connect_timeout_ms: 200
      read_timeout_ms: 5000
      write_timeout_ms: 5000
      request_timeout_ms: 10000

  media_crawler:
    enabled: true
    service_name: media-crawler
    base_domain: ${MEDIA_CRAWLER_ADDR:-http://127.0.0.1:8004}
    use_discovery: false
    timeout:
      enabled: true
      connect_timeout_ms: 200
      read_timeout_ms: 5000
      write_timeout_ms: 5000
      request_timeout_ms: 10000
