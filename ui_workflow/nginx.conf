server {
    listen 80;
    root /usr/share/nginx/html/workflow;

    # Preserve the browser origin for Kratos cookies, actions and redirects.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    # Match the canonical API origin used by Oathkeeper, as Vite's
    # changeOrigin proxy does in development. Cookies remain host scoped.
    location /api/ {
        proxy_pass http://media-agent-gateway:80;
        proxy_set_header Host $host:18080;
        proxy_set_header X-Forwarded-Host $host:18080;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # These are backend endpoints and Ory-owned pages, never SPA routes.
    location ~ ^/(self-service|sessions|schemas|ory|settings|recovery|verification|logout|error)(/|$) {
        proxy_pass http://media-agent-gateway:80;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~ ^/\.well-known/(ory/|jwks\.json$) {
        proxy_pass http://media-agent-gateway:80;
    }

    # Only Ory's explicit assets go upstream; hashed app bundles stay local.
    location ~ ^/assets/(normalize\.css|inter-font\.css|jetbrains-mono-font\.css|fa-brands\.min\.css|fa-solid\.min\.css|fontawesome\.min\.css|passwordInput\.js|inter/.*|jetbrains-mono/.*|webfonts/.*)$ {
        proxy_pass http://media-agent-gateway:80;
    }

    location ~ ^/(auth-layout\.css|content-layout\.css|main\.css|style\.css|theme\.css|ory-logo\.svg|ory-small\.svg|favico\.png)$ {
        proxy_pass http://media-agent-gateway:80;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
