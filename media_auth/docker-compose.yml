services:
  media_auth:
    build:
      context: ..
      dockerfile: media_auth/Dockerfile
    expose:
    - "8001"
    env_file:
    - ../docker-compose/.env.${INFRA:-e2e}
    environment:
      SERVER_ADDR: :8001
      CONSUL_ENABLED: 'false'
      MEDIA_AUTH_DB_DSN: postgres://media_auth:media_auth@host.docker.internal:5432/media_auth?sslmode=disable
      MEDIA_AUTH_INTERNAL_TOKEN: ${MEDIA_AUTH_INTERNAL_TOKEN:-dev-media-auth-internal-token}
      KETO_READ_URL: http://keto:4466
      KETO_WRITE_URL: http://keto:4467
      INTERNAL_JWKS_URL: http://oathkeeper:4456/.well-known/jwks.json
      INTERNAL_JWT_ISSUER: http://oathkeeper:4456/
      ORY_KRATOS_PUBLIC_URL: http://kratos:4433
      ORY_KRATOS_ADMIN_URL: http://kratos:4434
      TALOS_URL: http://talos:4420
      MEDIA_CONTROL_URL: http://host.docker.internal:8007
      CONTROL_INTERNAL_TOKEN: ${CONTROL_INTERNAL_TOKEN:-dev-control-internal-token}
      # Dedicated write credential, disabled unless explicitly configured.
      MEDIA_AUTH_AGENT_GATEWAY_TOKEN: ${MEDIA_AUTH_AGENT_GATEWAY_TOKEN:-}
      LOG_DIR: /media_logs/media-auth
      PLATFORM_TOKEN_ENABLED: ${PLATFORM_TOKEN_ENABLED:-false}
    volumes:
    - ../media_logs/media-auth:/media_logs/media-auth
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - default
    - auth
    - media-net
    restart: unless-stopped

networks:
  auth:
    external: true
    name: media-auth
  media-net:
    external: true
    name: media-net
