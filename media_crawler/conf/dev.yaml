app:
  name: media-crawler
  version: v1
  env: ${APP_ENV:-dev}

server:
  enabled: true
  address: ${SERVER_ADDR:-:8004}

database:
  enabled: true
  driver: postgres
  dsn: ${POSTGRES_DSN:-postgres://media_auth:media_auth@127.0.0.1:5432/media-crawler?sslmode=disable}
  max_open_conns: 50
  max_idle_conns: 10
  migrate_on_start: true

consul:
  enabled: ${CONSUL_ENABLED:-false}

consul_kv:
  enabled: ${CONSUL_KV_ENABLED:-false}

otel:
  enabled: ${OTEL_ENABLED:-false}

prometheus:
  enabled: ${PROMETHEUS_ENABLED:-false}

access_log:
  enabled: true
  format: "[${time}] ${status} - ${latency} ${method} ${path}"
  time_format: "2006-01-02T15:04:05Z"

log:
  enabled: true
  level: ${LOG_LEVEL:-debug}
  dir: ${LOG_DIR:-}
  filename: app.log
  max_size_mb: 100
  max_backups: 10
  max_age_days: 7
  compress: true
  console: true

recovery:
  enabled: true
  print_stack: true

request_id:
  enabled: true
  header: "X-Request-ID"

cors:
  enabled: true
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["*"]
  allow_credentials: false
  max_age_seconds: 600

pprof:
  enabled: true
  prefix: "/debug/pprof"

health:
  enabled: true
  path: "/health"

# media_crawler 抓取编排（subprocess 调 Python 爬虫，见 ADR-0003）
crawler:
  enabled: ${CRAWLER_ENABLED:-true}
  python_path: ${PYTHON_PATH:-/home/tao/code/github/media_crawler/MediaCrawlerPro-Python/.venv/bin/python}
  runner_path: ${MCP_RUNNER_PATH:-/home/tao/code/github/media_agent/media_crawler/script/mcp_runner.py}
  work_dir: ${CRAWLER_WORK_DIR:-/home/tao/code/github/media_crawler/MediaCrawlerPro-Python}
  max_serial: 1
  log_tail_lines: 100
  timeout_seconds: 0
  default_on_busy: queue

# 爬虫 MySQL（只读，跨库查内容数据；独立于自有 PG database 段）
crawl_data:
  enabled: ${CRAWL_DATA_ENABLED:-true}
  dsn: ${CRAWL_DATA_DSN:-root:123456@tcp(127.0.0.1:13306)/media_crawler_pro?charset=utf8mb4}
  max_open_conns: 10
  max_idle_conns: 5
  checkpoint_dir: data/checkpoints
